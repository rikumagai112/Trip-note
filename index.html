<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>TRIP NOTE</title>
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TRIP NOTE">
<!-- Deliberately NOT setting apple-mobile-web-app-capable here: enabling iOS's
     fullscreen "standalone" launch mode gives home-screen apps their own
     separate storage, which breaks the "stay signed in" behavior below. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    --bg:#f2f1ec;
    --app-bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f1efe9;
    --border:#e3e0d6;
    --text:#1c1b19;
    --text-dim:#716d63;
    --link:#2F5FD6;
    --accent-blue:#4C7EF3;
    --accent-green:#2f9d6c;
    --accent-orange:#d97e33;
    --accent-purple:#9b4fd1;
    --accent-pink:#d24a76;
    --danger:#d1483f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a0a0d;
      --app-bg:#101014;
      --surface:#17171d;
      --surface-2:#1f1f27;
      --border:#2b2b34;
      --text:#f2f1ee;
      --text-dim:#9c9aa3;
      --link:#7DA3F5;
      --accent-blue:#4C7EF3;
      --accent-green:#3FB27F;
      --accent-orange:#F0954A;
      --accent-purple:#B15FE8;
      --accent-pink:#E85C8A;
      --danger:#e0685f;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Noto Sans JP', sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .heavy{ font-weight:900; }
  .hidden{ display:none !important; }
  button, input, textarea{ font-family:inherit; }
  button{ cursor:pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent-blue); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  .app{ max-width:520px; margin:0 auto; min-height:100vh; background:var(--app-bg); position:relative; }

  /* ---------- Home ---------- */
  .home-header{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:24px 20px 16px; }
  .brand{ font-size:22px; font-weight:900; letter-spacing:.5px; }
  .home-tabs{ display:flex; gap:10px; padding:0 20px 16px; }
  .home-tab-btn{ flex:1; padding:12px; border-radius:12px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); font-size:13px; }
  .home-tab-btn.active{ background:var(--surface-2); color:var(--text); border-color:var(--accent-blue); }
  #trip-list{ padding:0 20px 60px; }
  .trip-card{ border:1px solid var(--border); background:var(--surface); margin-bottom:16px; overflow:hidden; border-radius:16px; position:relative; }
  .trip-photo{ height:150px; background-color:var(--surface-2); background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; }
  .trip-photo-fallback{ font-size:40px; opacity:.9; }
  .trip-card-body{ padding:14px 16px; position:relative; }
  .trip-card-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; }
  .badge{ font-size:11px; padding:4px 10px; border-radius:20px; background:rgba(76,126,243,.16); color:var(--link); white-space:nowrap; }
  .badge.past{ background:rgba(156,154,163,.18); color:var(--text-dim); }
  .trip-location{ font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trip-card-body h3{ font-size:16.5px; margin:0 0 6px; }
  .trip-dates{ font-size:12px; color:var(--text-dim); }
  .trip-edit-icon{ position:absolute; top:12px; right:12px; background:none; border:none; color:var(--text-dim); font-size:15px; padding:6px; }
  .trip-edit-icon:hover{ color:var(--text); }
  .empty-state{ text-align:center; padding:48px 24px; color:var(--text-dim); border:1px dashed var(--border); font-size:13px; line-height:1.9; border-radius:14px; }

  /* ---------- Buttons ---------- */
  .btn-outline{ border:1px solid var(--accent-blue); background:none; padding:9px 14px; border-radius:10px; font-size:12.5px; color:var(--link); white-space:nowrap; transition:background .15s, color .15s; }
  .btn-outline:hover{ background:var(--accent-blue); color:#fff; }
  .btn-outline.small{ padding:5px 10px; font-size:11px; }
  .btn-outline.full{ width:100%; text-align:center; display:block; }
  .btn-primary{ flex:1; background:var(--accent-blue); color:#fff; border:none; padding:12px; border-radius:10px; font-size:14px; }
  .btn-secondary{ flex:1; background:none; border:1px solid var(--border); padding:12px; border-radius:10px; font-size:14px; color:var(--text); }
  .btn-delete{ background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline; display:block; margin:18px auto 0; }
  .btn-delete:hover{ color:var(--text); }
  .icon-only-btn{ background:none; border:none; font-size:18px; color:var(--text); padding:8px; border-radius:8px; }
  .icon-only-btn:hover{ background:var(--surface-2); }
  .icon-only-btn.danger{ color:var(--danger); }
  .hero-icon-btn{ position:absolute; top:14px; width:36px; height:36px; border-radius:50%; background:rgba(20,20,24,.55); border:none; color:#fff; font-size:16px; z-index:3; }
  .hero-back{ left:14px; } .hero-edit{ right:14px; }

  /* ---------- Trip detail ---------- */
  .detail-hero{ position:relative; height:230px; overflow:hidden; background-size:cover; background-position:center; }
  .hero-fallback-icon{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:64px; z-index:1; }
  .hero-scrim{ position:absolute; inset:0; background:linear-gradient(to top, rgba(8,8,10,.9), rgba(8,8,10,0) 60%); z-index:2; }
  .hero-title-wrap{ position:absolute; left:20px; right:20px; bottom:16px; z-index:3; }
  .hero-title-wrap h2{ color:#fff; font-size:20px; margin:0; }
  .detail-info-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 20px; font-size:12.5px; color:var(--text-dim); border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .tab-bar{ display:flex; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab-btn{ flex:1; background:none; border:none; border-bottom:2px solid transparent; padding:13px 2px; font-size:11.5px; color:var(--text-dim); white-space:nowrap; }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--accent-blue); font-weight:700; }
  .tab-content{ padding:20px; padding-bottom:60px; }
  .tab-toolbar-single{ margin-bottom:16px; }

  /* ---------- Item / candidate detail screens ---------- */
  .detail-topbar{ display:flex; align-items:center; gap:2px; padding:12px 8px; border-bottom:1px solid var(--border); }
  .detail-topbar-title{ flex:1; font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 6px; }
  .detail-page-content{ padding-bottom:50px; }
  .detail-icon-card{ display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin:16px 16px 0; }
  .detail-icon-square{ width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .detail-icon-title{ font-size:16px; }
  .detail-icon-type{ font-size:12px; margin-top:4px; font-weight:700; }
  .detail-info-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:0 16px; margin:16px 16px 0; }
  .detail-row{ display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row-label{ color:var(--text-dim); flex-shrink:0; }
  .detail-row-value{ text-align:right; word-break:break-word; }
  .detail-map-wrap{ margin:16px; }
  .map-embed{ width:100%; height:180px; border:none; border-radius:14px; display:block; }
  .map-open-link{ display:block; text-align:center; margin-top:10px; color:var(--link); font-size:13px; text-decoration:none; padding:10px; }
  .detail-action-row{ margin:20px 16px 0; }

  /* ---------- Day pills / timeline ---------- */
  .day-pills-scroll{ overflow-x:auto; margin:0 -20px; padding:0 20px; }
  .day-pills{ display:flex; gap:8px; padding-bottom:4px; }
  .day-pill{ flex-shrink:0; width:50px; padding:8px 4px; border-radius:12px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); text-align:center; display:flex; flex-direction:column; gap:2px; }
  .day-pill-wd{ font-size:10px; } .day-pill-num{ font-size:15px; font-weight:700; }
  .day-pill.active{ background:var(--text); color:var(--app-bg); border-color:var(--text); }
  .tl-row{ display:flex; gap:10px; }
  .tl-time{ width:42px; flex-shrink:0; font-size:11.5px; color:var(--text-dim); padding-top:12px; text-align:right; }
  .tl-line-wrap{ display:flex; flex-direction:column; align-items:center; width:14px; flex-shrink:0; }
  .tl-dot{ width:11px; height:11px; border-radius:50%; margin-top:14px; flex-shrink:0; }
  .tl-line{ flex:1; width:2px; background:var(--border); margin-top:2px; }
  .tl-row:last-child .tl-line{ display:none; }
  .tl-card{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:14px; min-width:0; }
  .tl-card-head{ display:flex; align-items:center; gap:10px; }
  .tl-icon{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .tl-title{ flex:1; font-size:14px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tl-endtime{ font-size:11px; color:var(--text-dim); flex-shrink:0; }
  .tl-place{ font-size:12px; color:var(--text-dim); margin-top:8px; }
  .tl-memo{ font-size:12px; color:var(--text-dim); margin-top:6px; }
  .tl-cost{ font-size:12px; font-weight:700; margin-top:8px; text-align:right; }

  /* ---------- Spots ---------- */
  .spot-section-title{ font-size:12.5px; color:var(--text-dim); margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  .spot-count{ background:var(--surface-2); padding:1px 8px; border-radius:10px; font-size:11px; }
  .spot-card{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
  .spot-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .spot-body{ flex:1; min-width:0; }
  .spot-title{ font-size:13.5px; font-weight:700; }
  .spot-address{ font-size:11.5px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spot-tag{ font-size:10.5px; color:var(--text-dim); margin-top:4px; }
  .spot-chevron{ color:var(--text-dim); font-size:18px; }
  .spot-remove{ background:none; border:none; color:var(--text-dim); font-size:16px; padding:4px 8px; }

  /* ---------- Cost ---------- */
  .stat-row{ display:flex; gap:10px; margin-bottom:22px; }
  .stat-box{ flex:1; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:14px 8px; text-align:center; }
  .stat-value{ font-size:17px; font-weight:700; }
  .stat-label{ font-size:10.5px; color:var(--text-dim); margin-top:5px; }
  .item-row{ display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border); }
  .item-body{ flex:1; min-width:0; }
  .item-title{ font-weight:700; font-size:14px; }
  .item-meta{ font-size:12px; color:var(--text-dim); margin-top:3px; }
  .item-cost{ font-size:13px; font-weight:700; white-space:nowrap; padding-left:6px; text-align:right; }
  .item-cost.unpaid::after{ content:attr(data-unpaid-label); display:block; font-size:9.5px; font-weight:400; color:var(--text-dim); }
  .map-link, .attach-link{ color:var(--link); text-decoration:underline; text-decoration-color:rgba(76,126,243,.35); background:none; border:none; padding:0; font-size:12px; cursor:pointer; }
  .paid-checkbox{ width:22px; height:22px; border-radius:50%; border:2px solid var(--text-dim); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; margin-top:2px; }
  .paid-checkbox.checked{ background:var(--accent-green); border-color:var(--accent-green); }

  /* ---------- Prep ---------- */
  .sub-tab-pills{ display:flex; gap:8px; margin-bottom:18px; }
  .sub-tab-btn{ flex:1; padding:11px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); border-radius:10px 10px 0 0; font-size:13px; border-bottom:2px solid transparent; }
  .sub-tab-btn.active{ color:var(--text); border-bottom-color:var(--accent-blue); background:var(--surface-2); }
  .checklist-add-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .checklist-add-row select#checklist-category-input{ flex:0 0 108px; }
  .checklist-add-row input#checklist-input{ flex:2; min-width:160px; }
  .checklist-add-row select, .checklist-add-row input{ padding:9px 10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:16px; border-radius:8px; }
  .progress-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .progress-bar-track{ height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-bottom:20px; }
  .progress-bar-fill{ height:100%; background:var(--accent-green); }
  .checklist-group-title{ font-size:11.5px; color:var(--text-dim); margin:18px 0 6px; }
  .checklist-group:first-child .checklist-group-title{ margin-top:0; }
  .checklist-row{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
  .sq-checkbox{ width:20px; height:20px; border:2px solid var(--text-dim); border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .sq-checkbox.checked{ background:var(--accent-green); border-color:var(--accent-green); }
  .checklist-text{ flex:1; font-size:14px; }
  .checklist-text.done{ text-decoration:line-through; color:var(--text-dim); }
  .delete-btn{ background:none; border:none; color:var(--text-dim); font-size:17px; padding:4px 8px; }
  .delete-btn:hover{ color:var(--text); }
  .note-card{ border-top:2px dashed var(--border); padding:16px 2px; }
  .note-text{ font-size:14px; white-space:pre-wrap; line-height:1.7; }
  .note-date{ font-size:11px; color:var(--text-dim); margin-top:10px; text-align:right; }

  /* ---------- Memories ---------- */
  .memory-card{ border:1px solid var(--border); background:var(--surface); border-radius:16px; overflow:hidden; margin-bottom:16px; }
  .memory-photo{ width:100%; max-height:220px; object-fit:cover; display:block; }
  .memory-text{ font-size:13.5px; padding:14px 16px 4px; white-space:pre-wrap; line-height:1.7; }
  .memory-card .note-date{ padding:0 16px 14px; border:none; margin-top:6px; }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(4,4,6,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; opacity:0; pointer-events:none; transition:opacity .15s; }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal-panel{ background:var(--surface); width:100%; max-width:420px; max-height:88vh; overflow-y:auto; padding:24px; border-radius:16px; transform:translateY(10px); transition:transform .15s; border:1px solid var(--border); }
  .modal-overlay.open .modal-panel{ transform:translateY(0); }
  .modal-panel h3{ margin:0 0 4px; font-size:18px; }
  .modal-panel label{ display:block; font-size:11.5px; color:var(--text-dim); margin:16px 0 6px; }
  .modal-panel input[type=text], .modal-panel input[type=time], .modal-panel input[type=number], .modal-panel input[type=file], .modal-panel textarea, .modal-panel select{
    width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:16px; background:var(--surface-2); color:var(--text);
  }
  .modal-panel input[type=file]{ font-size:13px; color:var(--text-dim); padding:8px 6px; }
  .modal-panel textarea{ resize:vertical; min-height:80px; }
  ::placeholder{ color:var(--text-dim); opacity:.75; }
  /* Absolute safety net: iOS Safari zooms in on focus if the *computed*
     font-size of the focused field is under 16px. This overrides every
     input/textarea/select on the page at the moment it's focused, no
     matter what other rule (or specificity fight) might apply otherwise. */
  input:focus, textarea:focus, select:focus{ font-size:16px !important; }
  .date-field{ width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); font-size:16px; text-align:left; color:var(--text); }
  .date-field.placeholder{ color:var(--text-dim); }
  .checkbox-label{ display:flex !important; align-items:center; gap:8px; margin-top:16px !important; font-size:13px; color:var(--text); }
  .checkbox-label input{ width:auto; }
  .form-row-2{ display:flex; gap:12px; } .form-row-2 > div{ flex:1; }
  .icon-picker{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .icon-btn{ width:38px; height:38px; border:1px solid var(--border); background:var(--surface-2); font-size:17px; border-radius:50%; }
  .icon-btn.selected{ border-color:var(--accent-blue); background:var(--accent-blue); }
  .type-picker{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .type-chip{ border:1px solid var(--border); background:var(--surface-2); padding:8px 12px; border-radius:20px; font-size:12px; color:var(--text-dim); display:inline-flex; gap:6px; align-items:center; }
  .type-chip.selected{ background:var(--chip-color); border-color:var(--chip-color); color:#fff; }
  .modal-actions{ display:flex; gap:10px; margin-top:24px; }
  .attachment-chip{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px; border:1px solid var(--border); background:var(--surface-2); border-radius:8px; font-size:13px; margin-top:8px; }
  .attachment-chip .attachment-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attachment-empty{ font-size:12px; color:var(--text-dim); margin-top:8px; }
  .attachment-hint{ font-size:10.5px; color:var(--text-dim); margin-top:6px; }
  .cover-preview-wrap{ position:relative; margin-top:8px; }
  .cover-preview-wrap img{ width:100%; max-height:160px; object-fit:cover; border-radius:10px; display:block; }
  .cover-remove-btn{ position:absolute; top:8px; right:8px; background:rgba(10,10,12,.7); color:#fff; border-radius:50%; width:26px; height:26px; text-decoration:none; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--accent-blue); color:#fff; padding:10px 22px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:200; }
  .toast.show{ opacity:1; }

  #date-picker-popup{ position:fixed; z-index:150; background:var(--surface); border:1px solid var(--border); box-shadow:0 8px 28px rgba(0,0,0,.35); padding:14px; width:280px; border-radius:14px; display:none; }
  #date-picker-popup.open{ display:block; }
  .dp-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .dp-header button{ background:none; border:none; font-size:16px; color:var(--text); padding:6px 10px; }
  .dp-title{ font-size:14px; font-weight:700; }
  .dp-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; color:var(--text-dim); margin-bottom:4px; }
  .dp-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .dp-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:13px; border:none; background:none; color:var(--text); border-radius:8px; }
  .dp-empty{ visibility:hidden; }
  .dp-day:hover{ background:var(--surface-2); }
  .dp-day.today{ font-weight:700; text-decoration:underline; }
  .dp-day.in-range{ background:rgba(76,126,243,.16); border-radius:0; }
  .dp-day.selected{ background:var(--accent-blue); color:#fff; }

  /* ---------- Firebase login gate ---------- */
  .login-gate{ position:fixed; inset:0; background:var(--bg); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-gate.hidden{ display:none !important; }
  .login-box{ width:100%; max-width:340px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; }
  .login-box label{ display:block; font-size:11.5px; color:var(--text-dim); margin:14px 0 6px; }
  .login-box input{ width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); font-size:16px; }
  .login-error{ color:var(--danger); font-size:12px; margin-top:12px; min-height:16px; }
  .login-hint{ font-size:11px; color:var(--text-dim); margin-top:18px; line-height:1.7; }
</style>
</head>
<body>

<div id="login-gate" class="login-gate">
  <div class="login-box">
    <div class="brand" style="margin-bottom:4px;">TRIP NOTE</div>
    <label for="login-email">Email</label>
    <input type="email" id="login-email" autocomplete="username">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" autocomplete="current-password">
    <button type="button" class="btn-primary" id="login-submit" style="width:100%;margin-top:20px;">ログイン / Log in</button>
    <div class="login-error" id="login-error"></div>
    <div class="login-hint">Firebase Authenticationに登録した2人だけがログインできます。</div>
  </div>
</div>

<div class="app hidden">
  <div id="screen-home">
    <div class="home-header">
      <div class="brand">TRIP NOTE</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn-outline" data-i18n="addTrip" onclick="openTripModal(null)"></button>
        <button class="icon-only-btn" id="logout-btn" title="ログアウト / Log out" style="font-size:16px;">⎋</button>
      </div>
    </div>
    <div class="home-tabs" id="home-tabs"></div>
    <div id="trip-list"></div>
  </div>

  <div id="screen-trip" class="hidden">
    <div class="detail-hero" id="detail-hero">
      <button id="back-btn" class="hero-icon-btn hero-back" data-i18n-aria="back">←</button>
      <button id="edit-trip-btn" class="hero-icon-btn hero-edit" data-i18n-aria="editTrip">✎</button>
      <div class="hero-fallback-icon" id="hero-fallback-icon"></div>
      <div class="hero-scrim"></div>
      <div class="hero-title-wrap"><h2 id="trip-detail-title" class="heavy"></h2></div>
    </div>
    <div class="detail-info-row">
      <span id="trip-detail-location"></span>
      <span id="trip-detail-dates"></span>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="items" data-i18n="tabItems"></button>
      <button class="tab-btn" data-tab="spots" data-i18n="tabSpots"></button>
      <button class="tab-btn" data-tab="costs" data-i18n="tabCosts"></button>
      <button class="tab-btn" data-tab="prep" data-i18n="tabPrep"></button>
      <button class="tab-btn" data-tab="memories" data-i18n="tabMemories"></button>
    </div>
    <div id="tab-content" class="tab-content"></div>
  </div>

  <div id="screen-item-detail" class="hidden">
    <div class="detail-topbar">
      <button id="item-detail-back" class="icon-only-btn" data-i18n-aria="back">←</button>
      <div class="detail-topbar-title" id="item-detail-topbar-title"></div>
      <button id="item-detail-edit" class="icon-only-btn" data-i18n-aria="editItem">✎</button>
      <button id="item-detail-delete" class="icon-only-btn danger" data-i18n-aria="deleteItem">🗑</button>
    </div>
    <div class="detail-page-content" id="item-detail-content"></div>
  </div>
</div>

  async function loadTripData(id){

  function escapeHtml(str){

  }
  function normalizeUrl(u){ if(!u) return ''; return /^https?:\/\//i.test(u) ? u : ('https://' + u); }

  function formatISODate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function formatDateJP(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr+'T00:00:00');
    return new Intl.DateTimeFormat(locale(), { year:'numeric', month:'numeric', day:'numeric', weekday:'short' }).format(d);
  }
  function formatDateRange(start, end){
    const s = new Date(start+'T00:00:00');
    const e = new Date(end+'T00:00:00');
    const startStr = new Intl.DateTimeFormat(locale(), { year:'numeric', month:'numeric', day:'numeric' }).format(s);
    const endStr = new Intl.DateTimeFormat(locale(), s.getFullYear()===e.getFullYear() ? { month:'numeric', day:'numeric' } : { year:'numeric', month:'numeric', day:'numeric' }).format(e);
    return `${startStr} - ${endStr}`;
  }
  function formatYen(n){ return '¥' + Number(n||0).toLocaleString('ja-JP'); }
  function formatDateTime(ts){
    const d = new Date(ts);
    return new Intl.DateTimeFormat(locale(), { year:'numeric', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }).format(d);
  }
  function sortKey(it){ return (it.date||'') + (it.startTime || ''); }
  function dayPillLabel(dateStr){
    const dt = new Date(dateStr+'T00:00:00');
    const wd = new Intl.DateTimeFormat(locale(), { weekday:'short' }).format(dt);
    return { wd, day: dt.getDate() };
  }
  function monthTitle(year, month){
    return new Intl.DateTimeFormat(locale(), { year:'numeric', month:'long' }).format(new Date(year, month, 1));
  }
  function mondayFirstWeekdayNames(){
    const names = [];
    for(let i=0; i<7; i++){ names.push(new Intl.DateTimeFormat(locale(), { weekday:'short' }).format(new Date(2024,0,1+i))); }
    return names;
  }
  function buildDayList(trip){
    const days = [];
    let d = new Date(trip.start+'T00:00:00');
    const end = new Date(trip.end+'T00:00:00');
    while(d <= end){ days.push(formatISODate(d)); d.setDate(d.getDate()+1); }
    return days;
  }
  function computeCostStats(items){
    const withCost = items.filter(it => Number(it.cost) > 0);
    const total = withCost.reduce((s,it) => s + Number(it.cost), 0);
    const paid = withCost.filter(it => it.paid).reduce((s,it) => s + Number(it.cost), 0);
    return { total, paid, unpaid: total - paid, items: withCost };
  }

  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------- Custom date picker (single + range, Monday start, Gregorian year) ---------- */
  let datePickerMode = 'single';

  function setDateField(id, dateStr){

  function openRangeDatePicker(fieldId){

    rangeStart = btn.dataset.start || null;
    rangeEnd = btn.dataset.end || null;

    const base = rangeStart ? new Date(rangeStart+'T00:00:00') : new Date();
    datePickerViewYear = base.getFullYear();

    renderDatePickerCalendar();
    positionDatePickerPopup(btn);

  function positionDatePickerPopup(btn){
    const rect = btn.getBoundingClientRect();
    const popup = document.getElementById('date-picker-popup');
    const popupWidth = 280;
    const popupHeightEstimate = 320;
    let top = rect.bottom + 6;
    let left = rect.left;
    if(left + popupWidth > window.innerWidth - 10) left = window.innerWidth - popupWidth - 10;
    if(left < 10) left = 10;
    if(top + popupHeightEstimate > window.innerHeight - 10){
      top = rect.top - popupHeightEstimate - 6;
      if(top < 10) top = 10;
    }
    popup.style.top = top + 'px';
    popup.style.left = left + 'px';
  }
  function renderDatePickerCalendar(){
    document.getElementById('date-picker-title').textContent = monthTitle(datePickerViewYear, datePickerViewMonth);
    const firstDay = new Date(datePickerViewYear, datePickerViewMonth, 1);
    const offset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(datePickerViewYear, datePickerViewMonth+1, 0).getDate();
    const todayStr = formatISODate(new Date());
    const singleSelected = datePickerMode === 'single' ? document.getElementById(datePickerTarget).dataset.value : null;
    let cells = '';
    for(let i=0; i<offset; i++) cells += `<div class="dp-cell dp-empty"></div>`;
    for(let day=1; day<=daysInMonth; day++){
      const dateStr = `${datePickerViewYear}-${String(datePickerViewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      let cls = 'dp-cell dp-day';
      if(dateStr === todayStr) cls += ' today';
      if(datePickerMode === 'single'){
        if(dateStr === singleSelected) cls += ' selected';
      } else {
        if(dateStr === rangeStart || dateStr === rangeEnd) cls += ' selected';
        else if(rangeStart && rangeEnd && dateStr > rangeStart && dateStr < rangeEnd) cls += ' in-range';
      }
      cells += `<button type="button" class="${cls}" onclick="event.stopPropagation(); onDatePickerDayClick('${dateStr}')">${day}</button>`;
    }
    document.getElementById('date-picker-grid').innerHTML = cells;
  }
  function changeDatePickerMonth(delta){
    datePickerViewMonth += delta;
    if(datePickerViewMonth < 0){ datePickerViewMonth = 11; datePickerViewYear--; }
    if(datePickerViewMonth > 11){ datePickerViewMonth = 0; datePickerViewYear++; }
    renderDatePickerCalendar();
  }
  function onDatePickerDayClick(dateStr){
    if(datePickerMode === 'single'){
      setDateField(datePickerTarget, dateStr);
      closeDatePicker();
    } else {
      const btn = document.getElementById(datePickerTarget);
      if(rangeSelecting === 'start' || !rangeStart || (rangeStart && rangeEnd)){
        rangeStart = dateStr; rangeEnd = null; rangeSelecting = 'end';
        btn.dataset.start = rangeStart; btn.dataset.end = '';
        renderRangeFieldDisplay(datePickerTarget);
        renderDatePickerCalendar();
      } else {
        if(dateStr < rangeStart){ rangeEnd = rangeStart; rangeStart = dateStr; }
        else { rangeEnd = dateStr; }
        btn.dataset.start = rangeStart; btn.dataset.end = rangeEnd;
        renderRangeFieldDisplay(datePickerTarget);
        rangeSelecting = 'start';
        closeDatePicker();
      }
    }
  }

    const today = formatISODate(new Date());

      <button type="button" class="home-tab-btn ${homeFilter==='upcoming'?'active':''}" onclick="setHomeFilter('upcoming')">${t('upcoming')} (${upcoming.length})</button>
      <button type="button" class="home-tab-btn ${homeFilter==='past'?'active':''}" onclick="setHomeFilter('past')">${t('past')} (${past.length})</button>
    `;
    const list = homeFilter === 'upcoming' ? upcoming : past;

    if(list.length === 0){
      container.innerHTML = `<div class="empty-state">${homeFilter==='upcoming' ? t('homeEmptyUpcoming') : t('homeEmptyPast')}</div>`;
      return;
    }
    await Promise.all(list.filter(x => x.hasCover && !coverCache[x.id]).map(x => fetchCover(x.id)));

      const isPast = x.end < today;
      const photo = coverCache[x.id];
      return `
        <div class="trip-card" onclick="openTrip('${x.id}')">
          <div class="trip-photo" style="${photo ? `background-image:url('${photo}');` : ''}">${photo ? '' : `<div class="trip-photo-fallback">${x.icon}</div>`}</div>
          <div class="trip-card-body">

              <span class="badge ${isPast?'past':''}">${isPast?t('past'):t('upcoming')}</span>
              ${x.destination ? `<span class="trip-location">📍 ${escapeHtml(x.destination)}</span>` : ''}
            </div>
            <h3 class="heavy">${escapeHtml(x.title)}</h3>
            <div class="trip-dates">📅 ${formatDateRange(x.start, x.end)}</div>
            <button type="button" class="trip-edit-icon" onclick="event.stopPropagation(); editTripById('${x.id}')">✎</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function saveTripForm(){

    const start = rangeBtn.dataset.start || '';

    if(!title || !start || !end){ alert(t('alertTripRequired')); return; }
    let id, tr;
    if(editingTripId){
      id = editingTripId;
      tr = trips.find(x => x.id === id);
      tr.title = title; tr.destination = destination; tr.start = start; tr.end = end; tr.icon = selectedTripIcon;
    } else {

      trips.push(tr);

  async function deleteTrip(){
    if(!editingTripId) return;
    if(!confirm(t('confirmDeleteTrip'))) return;
    const id = editingTripId;
    const data = await loadTripData(id);
    trips = trips.filter(x => x.id !== id);
    await saveTrips();
    try{ await window.storage.delete('trip:'+id, true); }catch(e){}

    for(const it of data.items){ if(it.hasAttachment) await deleteAttachmentStorage(it.id); }
    delete tripDataCache[id];
    delete coverCache[id];
    closeModal('trip-modal');
    await renderHome();
    showToast(t('deleted'));

  /* ---------- Swipe between tabs ---------- */
  const TAB_ORDER = ['items', 'spots', 'costs', 'prep', 'memories'];
  let tabTouchStartX = 0, tabTouchStartY = 0, tabTouchStartedInScroller = false;
  function onTabContentTouchStart(e){
    if(!e.touches || !e.touches.length) return;
    const t = e.touches[0];
    tabTouchStartX = t.clientX; tabTouchStartY = t.clientY;
    tabTouchStartedInScroller = !!(e.target.closest && e.target.closest('.day-pills-scroll'));
  }
  function onTabContentTouchEnd(e){
    if(tabTouchStartedInScroller) return;
    if(!e.changedTouches || !e.changedTouches.length) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - tabTouchStartX;
    const dy = t.clientY - tabTouchStartY;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const idx = TAB_ORDER.indexOf(currentTab);
    if(dx < 0 && idx < TAB_ORDER.length - 1){ currentTab = TAB_ORDER[idx + 1]; renderTabContent(); }
    else if(dx > 0 && idx > 0){ currentTab = TAB_ORDER[idx - 1]; renderTabContent(); }
  }

  async function openAttachment(itemId){

      const w = window.open();
      if(w){ w.location = data.dataUrl; } else { alert(t('alertPopupBlocked')); }

    if(it.checkOut) rows += `<div class="detail-row"><span class="detail-row-label">${t('itemDetailCheckOut')}</span><span class="detail-row-value">${escapeHtml(it.checkOut)}</span></div>`;
    if(it.url) rows += `<div class="detail-row"><span class="detail-row-label">${t('itemDetailUrl')}</span><span class="detail-row-value"><a class="map-link" href="${escapeHtml(normalizeUrl(it.url))}" target="_blank" rel="noopener">${escapeHtml(it.url)}</a></span></div>`;
    if(Number(it.cost) > 0){ rows += `<div class="detail-row"><span class="detail-row-label">${t('itemDetailCost')}</span><span class="detail-row-value">${formatYen(it.cost)}${it.paid?t('paidSuffix'):t('unpaidSuffix')}</span></div>`; }
    if(it.memo) rows += `<div class="detail-row"><span class="detail-row-label">${t('itemDetailMemo')}</span><span class="detail-row-value">${escapeHtml(it.memo)}</span></div>`;
    if(it.hasAttachment) rows += `<div class="detail-row"><span class="detail-row-label">${t('itemDetailAttachment')}</span><span class="detail-row-value"><button type="button" class="attach-link" onclick="openAttachment('${it.id}')">📎 ${escapeHtml(it.attachmentName||'')}</button></span></div>`;

    `;

      html += `<div class="detail-map-wrap"><iframe class="map-embed" src="https://www.google.com/maps?q=${encodeURIComponent(it.place)}&output=embed" loading="lazy"></iframe><a class="map-open-link" href="${mapUrl}" target="_blank" rel="noopener">${t('mapOpen')}</a></div>`;

    itemDateBtn.dataset.start = dateStartVal;
    itemDateBtn.dataset.end = (item && item.endDate) ? item.endDate : dateStartVal;
    renderRangeFieldDisplay('item-form-date');
    document.getElementById('item-form-start-time').value = item ? (item.startTime || '') : '';
    document.getElementById('item-form-end-time').value = item ? (item.endTime || '') : '';
    document.getElementById('item-form-place').value = item ? (item.place || '') : '';
    document.getElementById('item-form-contact').value = item ? (item.contact || '') : '';
    document.getElementById('item-form-checkin').value = item ? (item.checkIn || '') : '';
    document.getElementById('item-form-checkout').value = item ? (item.checkOut || '') : '';
    document.getElementById('item-form-url').value = item ? (item.url || '') : '';
    document.getElementById('item-form-cost').value = item && item.cost ? item.cost : '';
    document.getElementById('item-form-paid').checked = item ? !!item.paid : false;
    document.getElementById('item-form-memo').value = item ? (item.memo || '') : '';
    selectedItemType = item ? (item.type || 'other') : 'other';
    renderTypeChips('item-type-picker', selectedItemType, ty => { selectedItemType = ty; });

    renderAttachmentPreview();

  function renderAttachmentPreview(){
    const el = document.getElementById('attachment-preview');
    if(pendingAttachment){
      el.innerHTML = `<div class="attachment-chip"><span class="attachment-name">📎 ${escapeHtml(pendingAttachment.name)}</span><button type="button" class="delete-btn" onclick="clearPendingAttachment()">×</button></div>`;
    } else if(existingAttachmentMeta && !removeAttachmentFlag){
      el.innerHTML = `<div class="attachment-chip"><span class="attachment-name">📎 ${escapeHtml(existingAttachmentMeta.name)}</span><button type="button" class="btn-outline small" onclick="openAttachment('${editingItemId}')">${t('open')}</button><button type="button" class="delete-btn" onclick="markRemoveAttachment()">×</button></div>`;
    } else {
      el.innerHTML = `<div class="attachment-empty">${t('attachmentEmpty')}</div>`;
    }
  }
  function handleAttachmentFile(input){
    const file = input.files[0];
    if(!file) return;
    if(file.size > MAX_ATTACHMENT_BYTES){ alert(t('alertFileTooBig')); input.value = ''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      pendingAttachment = { name: file.name, type: file.type, dataUrl: reader.result };
      removeAttachmentFlag = false;
      renderAttachmentPreview();
    };
    reader.onerror = () => { alert(t('alertFileFailed')); };
    reader.readAsDataURL(file);
  }
  function clearPendingAttachment(){ pendingAttachment = null; document.getElementById('item-form-file').value = ''; renderAttachmentPreview(); }
  function markRemoveAttachment(){ removeAttachmentFlag = true; renderAttachmentPreview(); }
  async function saveItemForm(){
    const title = val('item-form-title').trim();
    const itemDateBtn = document.getElementById('item-form-date');
    const date = itemDateBtn.dataset.start || '';
    const endDate = itemDateBtn.dataset.end || date;
    if(!title || !date){ alert(t('alertItemRequired')); return; }
    const startTime = val('item-form-start-time');
    const endTime = val('item-form-end-time');
    const place = val('item-form-place').trim();
    const contact = val('item-form-contact').trim();
    const checkIn = val('item-form-checkin').trim();
    const checkOut = val('item-form-checkout').trim();
    const url = val('item-form-url').trim();
    const cost = Number(val('item-form-cost')) || 0;
    const paid = document.getElementById('item-form-paid').checked;
    const memo = val('item-form-memo').trim();
    const data = tripDataCache[currentTripId];
    let item, itemId;
    if(editingItemId){
      item = data.items.find(i => i.id === editingItemId);
      itemId = editingItemId;
      Object.assign(item, { title, type: selectedItemType, date, endDate, startTime, endTime, place, contact, checkIn, checkOut, url, cost, paid, memo });
    } else {
      itemId = uid();
      item = { id: itemId, title, type: selectedItemType, date, endDate, startTime, endTime, place, contact, checkIn, checkOut, url, cost, paid, memo, hasAttachment: false };
      data.items.push(item);
    }
    if(pendingAttachment){
      try{
        await window.storage.set('attachment:'+itemId, JSON.stringify(pendingAttachment), true);
        item.hasAttachment = true; item.attachmentName = pendingAttachment.name; item.attachmentType = pendingAttachment.type;
      }catch(e){ alert(t('alertAttachmentFailed')); }
    } else if(removeAttachmentFlag){
      await deleteAttachmentStorage(itemId);
      item.hasAttachment = false; delete item.attachmentName; delete item.attachmentType;
    }
    let cameFromCandidate = false;
    if(promotingFromCandidateId){
      data.candidates = data.candidates.filter(c => c.id !== promotingFromCandidateId);
      cameFromCandidate = true;
    }
    await saveTripData(currentTripId);
    closeModal('item-modal');
    if(!document.getElementById('screen-item-detail').classList.contains('hidden') && currentDetailItemId === itemId){
      renderItemDetail(item);
    } else {
      renderTabContent();
    }
    if(cameFromCandidate && currentTab === 'spots') renderSpotsTab();
    showToast(t('saved'));
  }
  async function deleteItem(){
    if(!editingItemId) return;
    if(!confirm(t('confirmDeleteItem'))) return;
    const data = tripDataCache[currentTripId];
    const it = data.items.find(i => i.id === editingItemId);
    const wasDetailOpen = !document.getElementById('screen-item-detail').classList.contains('hidden') && currentDetailItemId === editingItemId;
    data.items = data.items.filter(i => i.id !== editingItemId);
    await saveTripData(currentTripId);
    if(it && it.hasAttachment) await deleteAttachmentStorage(it.id);
    closeModal('item-modal');
    if(wasDetailOpen){ closeItemDetail(); } else { renderTabContent(); }
    showToast(t('deleted'));
  }

  /* ---------- Spots tab ---------- */
  function openSpotsMap(){
    const data = tripDataCache[currentTripId];
    const scheduledPlaces = data.items.filter(it => it.place).slice().sort((a,b) => sortKey(a).localeCompare(sortKey(b))).map(it => it.place);
    const candidatePlaces = data.candidates.filter(c => c.place).map(c => c.place);
    const places = scheduledPlaces.concat(candidatePlaces);
    if(places.length === 0){ alert(t('alertNoMapPlaces')); return; }
    window.open('https://www.google.com/maps/dir/' + places.map(p => encodeURIComponent(p)).join('/'), '_blank');
  }
  function renderSpotsTab(){
    const trip = trips.find(x => x.id === currentTripId);
    const data = tripDataCache[currentTripId];
    const scheduled = data.items.filter(it => it.place).slice().sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
    let html = `<button type="button" class="btn-outline full" onclick="openSpotsMap()">${t('mapShow')}</button>`;
    html += `<div class="spot-section-title" style="margin-top:22px;">${t('scheduledSpots')} <span class="spot-count">${scheduled.length}</span></div>`;
    if(scheduled.length === 0){ html += `<div class="empty-state">${t('noScheduledSpots')}</div>`; }
    else {
      html += scheduled.map(it => {
        const info = typeInfo(it.type);
        const dayIndexStart = Math.floor((new Date(it.date+'T00:00:00') - new Date(trip.start+'T00:00:00')) / 86400000) + 1;
        const dayIndexEnd = it.endDate ? Math.floor((new Date(it.endDate+'T00:00:00') - new Date(trip.start+'T00:00:00')) / 86400000) + 1 : dayIndexStart;
        return `
          <div class="spot-card" onclick="openItemDetail('${it.id}')">
            <div class="spot-icon" style="background:${info.color}">${info.icon}</div>
            <div class="spot-body">
              <div class="spot-title">${escapeHtml(it.title)}</div>
              <div class="spot-address">${escapeHtml(it.place)}</div>
              <div class="spot-tag">${t('dayRangeOf', dayIndexStart, dayIndexEnd)} ${it.startTime||''}</div>
            </div>
            <div class="spot-chevron">›</div>
          </div>
        `;
      }).join('');
    }
    html += `<div class="spot-section-title" style="margin-top:28px;">${t('candidateSpots')} <span class="spot-count">${data.candidates.length}</span></div>`;
    if(data.candidates.length === 0){ html += `<div class="empty-state">${t('noCandidateSpots')}</div>`; }
    else {
      html += data.candidates.map(c => {
        const info = typeInfo(c.type);
        return `
          <div class="spot-card" onclick="promoteCandidate('${c.id}')">
            <div class="spot-icon" style="background:${info.color}">${info.icon}</div>
            <div class="spot-body">
              <div class="spot-title">${escapeHtml(c.title)}</div>
              ${c.place ? `<div class="spot-address">${escapeHtml(c.place)}</div>` : ''}
            </div>
            <button type="button" class="spot-remove" onclick="event.stopPropagation(); deleteCandidateDirect('${c.id}')">×</button>
          </div>
        `;
      }).join('');
    }
    html += `<button type="button" class="btn-outline full" style="margin-top:16px;" onclick="openCandidateModal(null)">${t('addCandidate')}</button>`;
    document.getElementById('tab-content').innerHTML = html;
  }
  function promoteCandidate(id){
    const c = tripDataCache[currentTripId].candidates.find(x => x.id === id);
    openItemModal({ title: c.title, type: c.type, place: c.place, contact: c.contact, checkIn: c.checkIn, checkOut: c.checkOut, url: c.url });

  async function saveCandidateForm(){
    const title = val('candidate-form-title').trim();
    if(!title){ alert(t('alertCandidateRequired')); return; }
    const place = val('candidate-form-place').trim();
    const contact = val('candidate-form-contact').trim();

  /* ---------- Prep tab ---------- */
  function setPrepSubTab(tb){ prepSubTab = tb; renderPrepTab(); }
  function renderPrepTab(){
    const data = tripDataCache[currentTripId];
    const inner = prepSubTab === 'checklist' ? buildChecklistHtml(data) : buildNotesHtml(data);
    document.getElementById('tab-content').innerHTML = `
      <div class="sub-tab-pills">
        <button type="button" class="sub-tab-btn ${prepSubTab==='checklist'?'active':''}" onclick="setPrepSubTab('checklist')">${t('checklistTab')}</button>
        <button type="button" class="sub-tab-btn ${prepSubTab==='notes'?'active':''}" onclick="setPrepSubTab('notes')">${t('notesTab')}</button>
      </div>
      ${inner}
    `;
  }
  function buildChecklistHtml(data){
    const total = data.checklist.length;
    const checked = data.checklist.filter(c => c.checked).length;
    const pct = total ? Math.round(checked / total * 100) : 0;
    const otherLabel = LANG === 'en' ? 'Other' : 'その他';
    const categories = [...new Set(data.checklist.map(c => c.category || otherLabel))];
    let html = `
      <div class="checklist-add-row">
        <select id="checklist-category-input" onchange="onCategorySelectChange()">
          ${categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
          <option value="__new__">${t('newCategoryOption')}</option>
        </select>
        <input type="text" id="checklist-input" placeholder="${t('checklistItemPlaceholder')}" onkeydown="if(event.key==='Enter') addChecklistItem()">
        <button type="button" class="btn-outline" onclick="addChecklistItem()">＋</button>
      </div>
      <div class="progress-row"><span>${checked} / ${total}</span><span>${pct}%</span></div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    `;
    if(data.checklist.length === 0){ html += `<div class="empty-state">${t('checklistEmpty')}</div>`; }
    else {
      html += groupChecklistByLabel(data.checklist, otherLabel).map(g => `
        <div class="checklist-group">
          <div class="checklist-group-title">${escapeHtml(g.cat)}</div>
          ${g.items.map(c => `
            <div class="checklist-row">
              <div class="sq-checkbox ${c.checked?'checked':''}" onclick="toggleChecklistItem('${c.id}')">${c.checked?'✓':''}</div>
              <div class="checklist-text ${c.checked?'done':''}">${escapeHtml(c.text)}</div>
              <button type="button" class="delete-btn" onclick="deleteChecklistItem('${c.id}')">×</button>
            </div>
          `).join('')}
        </div>
      `).join('');
    }
    return html;
  }
  function groupChecklistByLabel(items, otherLabel){
    const order = []; const map = {};
    items.forEach(it => {
      const cat = it.category || otherLabel;
      if(!map[cat]){ map[cat] = []; order.push(cat); }
      map[cat].push(it);
    });
    return order.map(cat => ({ cat, items: map[cat] }));
  }
  function onCategorySelectChange(){
    const sel = document.getElementById('checklist-category-input');
    if(sel.value === '__new__'){
      const name = (prompt(t('newCategoryPrompt')) || '').trim();
      if(name){
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        sel.insertBefore(opt, sel.lastElementChild);
        sel.value = name;
      } else {
        sel.selectedIndex = 0;
      }
    }
  }
  async function addChecklistItem(){
    const input = document.getElementById('checklist-input');
    const sel = document.getElementById('checklist-category-input');
    const text = input.value.trim();
    if(!text) return;
    const otherLabel = LANG === 'en' ? 'Other' : 'その他';
    const category = (sel.value && sel.value !== '__new__') ? sel.value : otherLabel;
    tripDataCache[currentTripId].checklist.push({ id: uid(), text, checked: false, category });
    input.value = '';
    await saveTripData(currentTripId);
    renderPrepTab();
    const refocus = document.getElementById('checklist-input');
    if(refocus) refocus.focus();
  }
  async function toggleChecklistItem(id){
    const item = tripDataCache[currentTripId].checklist.find(c => c.id === id);
    item.checked = !item.checked;
    await saveTripData(currentTripId);
    renderPrepTab();
  }
  async function deleteChecklistItem(id){
    const data = tripDataCache[currentTripId];
    data.checklist = data.checklist.filter(c => c.id !== id);
    await saveTripData(currentTripId);
    renderPrepTab();
  }
  function buildNotesHtml(data){
    let html = `<div class="tab-toolbar-single"><button type="button" class="btn-outline" onclick="openNoteModal(null)">${t('addNote')}</button></div>`;
    if(data.notes.length === 0){ html += `<div class="empty-state">${t('notesEmpty')}</div>`; }
    else {
      const sorted = data.notes.slice().sort((a,b) => b.createdAt - a.createdAt);
      html += sorted.map(n => `
        <div class="note-card" onclick="editNoteById('${n.id}')">
          <div class="note-text">${escapeHtml(n.text)}</div>
          <div class="note-date">${formatDateTime(n.createdAt)}</div>
        </div>
      `).join('');
    }
    return html;
  }
  function editNoteById(id){ openNoteModal(tripDataCache[currentTripId].notes.find(n => n.id === id)); }
  function openNoteModal(note){
    editingNoteId = note ? note.id : null;
    document.getElementById('note-modal-title').textContent = note ? t('editNote') : t('newNote');
    document.getElementById('note-form-text').value = note ? note.text : '';
    document.getElementById('note-delete-btn').style.display = note ? 'block' : 'none';
    openModal('note-modal');
  }
  async function saveNoteForm(){
    const text = val('note-form-text').trim();
    if(!text) return;
    const data = tripDataCache[currentTripId];
    if(editingNoteId){ data.notes.find(n => n.id === editingNoteId).text = text; }
    else { data.notes.push({ id: uid(), text, createdAt: Date.now() }); }
    await saveTripData(currentTripId);
    closeModal('note-modal');
    renderPrepTab();
    showToast(t('saved'));
  }
  async function deleteNote(){
    if(!editingNoteId) return;
    if(!confirm(t('confirmDeleteNote'))) return;
    const data = tripDataCache[currentTripId];
    data.notes = data.notes.filter(n => n.id !== editingNoteId);
    await saveTripData(currentTripId);
    closeModal('note-modal');
    renderPrepTab();
    showToast(t('deleted'));
  }

  /* ---------- Memories tab ---------- */
  function renderMemoriesTab(){
    const data = tripDataCache[currentTripId];
    let html = `<div class="tab-toolbar-single"><button type="button" class="btn-outline" onclick="openMemoryModal(null)">${t('addMemory')}</button></div>`;
    if(data.memories.length === 0){ html += `<div class="empty-state">${t('memoriesEmpty')}</div>`; }
    else {
      const sorted = data.memories.slice().sort((a,b) => b.createdAt - a.createdAt);
      html += sorted.map(m => `
        <div class="memory-card" onclick="editMemoryById('${m.id}')">
          ${m.photo ? `<img class="memory-photo" src="${m.photo}">` : ''}
          ${m.text ? `<div class="memory-text">${escapeHtml(m.text)}</div>` : ''}
          <div class="note-date">${formatDateTime(m.createdAt)}</div>
        </div>
      `).join('');
    }
    document.getElementById('tab-content').innerHTML = html;
  }
  function editMemoryById(id){ openMemoryModal(tripDataCache[currentTripId].memories.find(m => m.id === id)); }
  function openMemoryModal(memory){
    editingMemoryId = memory ? memory.id : null;
    pendingMemoryPhoto = memory ? (memory.photo || null) : null;
    document.getElementById('memory-form-file').value = '';
    document.getElementById('memory-modal-title').textContent = memory ? t('editMemory') : t('newMemory');
    document.getElementById('memory-form-text').value = memory ? (memory.text || '') : '';
    document.getElementById('memory-delete-btn').style.display = memory ? 'block' : 'none';
    renderMemoryPhotoPreview();
    openModal('memory-modal');
  }
  function renderMemoryPhotoPreview(){
    const el = document.getElementById('memory-photo-preview');
    el.innerHTML = pendingMemoryPhoto ? `<div class="cover-preview-wrap"><img src="${pendingMemoryPhoto}"><button type="button" class="delete-btn cover-remove-btn" onclick="removeMemoryPhoto()">×</button></div>` : '';
  }
  async function handleMemoryFile(input){
    const file = input.files[0];
    if(!file) return;
    try{ pendingMemoryPhoto = await compressImage(file, 800, 0.6); renderMemoryPhotoPreview(); }
    catch(e){ alert(t('alertImageFailed')); }
  }
  function removeMemoryPhoto(){ pendingMemoryPhoto = null; document.getElementById('memory-form-file').value = ''; renderMemoryPhotoPreview(); }
  async function saveMemoryForm(){
    const text = val('memory-form-text').trim();
    if(!text && !pendingMemoryPhoto){ alert(t('alertMemoryRequired')); return; }
    const data = tripDataCache[currentTripId];
    if(editingMemoryId){ const m = data.memories.find(m => m.id === editingMemoryId); m.text = text; m.photo = pendingMemoryPhoto; }
    else { data.memories.push({ id: uid(), text, photo: pendingMemoryPhoto, createdAt: Date.now() }); }
    await saveTripData(currentTripId);
    closeModal('memory-modal');
    renderMemoriesTab();
    showToast(t('saved'));
  }
  async function deleteMemory(){
    if(!editingMemoryId) return;
    if(!confirm(t('confirmDeleteMemory'))) return;
    const data = tripDataCache[currentTripId];
    data.memories = data.memories.filter(m => m.id !== editingMemoryId);
    await saveTripData(currentTripId);
    closeModal('memory-modal');
    renderMemoriesTab();
    showToast(t('deleted'));
  }

  /* ---------- Init ---------- */
  function setupListeners(){
    document.getElementById('back-btn').addEventListener('click', () => { goHome(); });
    document.getElementById('edit-trip-btn').addEventListener('click', () => openTripModal(trips.find(x => x.id === currentTripId)));
    document.querySelectorAll('.tab-btn').forEach(btn => { btn.addEventListener('click', () => { currentTab = btn.dataset.tab; renderTabContent(); }); });
    document.getElementById('tab-content').addEventListener('touchstart', onTabContentTouchStart, { passive: true });
    document.getElementById('tab-content').addEventListener('touchend', onTabContentTouchEnd, { passive: true });
    document.getElementById('item-detail-back').addEventListener('click', closeItemDetail);
    document.getElementById('item-detail-edit').addEventListener('click', editCurrentDetailItem);
    document.getElementById('item-detail-delete').addEventListener('click', deleteCurrentDetailItem);
    document.getElementById('trip-form-cancel').addEventListener('click', () => closeModal('trip-modal'));
    document.getElementById('trip-form-save').addEventListener('click', saveTripForm);
    document.getElementById('trip-delete-btn').addEventListener('click', deleteTrip);
    document.getElementById('item-form-cancel').addEventListener('click', () => closeModal('item-modal'));
    document.getElementById('item-form-save').addEventListener('click', saveItemForm);
    document.getElementById('item-delete-btn').addEventListener('click', deleteItem);
    document.getElementById('candidate-form-cancel').addEventListener('click', () => closeModal('candidate-modal'));
    document.getElementById('candidate-form-save').addEventListener('click', saveCandidateForm);
    document.getElementById('candidate-delete-btn').addEventListener('click', deleteCandidate);
    document.getElementById('note-form-cancel').addEventListener('click', () => closeModal('note-modal'));
    document.getElementById('note-form-save').addEventListener('click', saveNoteForm);
    document.getElementById('note-delete-btn').addEventListener('click', deleteNote);
    document.getElementById('memory-form-cancel').addEventListener('click', () => closeModal('memory-modal'));
    document.getElementById('memory-form-save').addEventListener('click', saveMemoryForm);
    document.getElementById('memory-delete-btn').addEventListener('click', deleteMemory);
    document.querySelectorAll('.modal-overlay').forEach(ov => { ov.addEventListener('click', e => { if(e.target === ov) ov.classList.remove('open'); }); });
    document.addEventListener('click', (e) => {
      const popup = document.getElementById('date-picker-popup');
      if(!popup.classList.contains('open')) return;
      if(popup.contains(e.target)) return;
      if(e.target.classList && e.target.classList.contains('date-field')) return;
      closeDatePicker();
    });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDatePicker(); });
  }
  async function init(){
    applyStaticTranslations();
    await loadTrips();
    await renderHome();
    setupListeners();
  }
  // Not auto-started here — trip-note-firebase.html waits for a successful
  // Firebase sign-in before calling this (see the Firebase module script below).
  window.appInit = init;
</script>

<!-- =======================================================================
     FIREBASE BACKEND — replaces Claude.ai's built-in window.storage with
     Firebase Authentication + Cloud Firestore, so this file can be hosted
     anywhere (e.g. GitHub Pages) while still syncing data between exactly
     the people you register in Firebase Authentication.

     Setup steps: see the accompanying "Firebase + GitHub Pages 公開マニュアル".
     You only need to edit the firebaseConfig object below — everything
     else works as-is once your Firebase project is set up.
     ======================================================================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
    setPersistence, browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  // ▼▼▼ Firebaseコンソール → プロジェクトの設定 → 「マイアプリ」で取得した値に置き換えてください ▼▼▼
  const firebaseConfig = {
    apiKey: "AIzaSyCkdaawL5pLnVhOS66zRHNrg93nF622RFw",
    authDomain: "trip-note-ccf03.firebaseapp.com",
    projectId: "trip-note-ccf03",
    storageBucket: "trip-note-ccf03.firebasestorage.app",
    messagingSenderId: "258936823559",
    appId: "1:258936823559:web:ded162e49f36754940efa2"
  };
  // ▲▲▲ ここまで ▲▲▲

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);
  // Keep the sign-in persisted in this browser (IndexedDB) so people don't
  // have to log in again every time they open the page.
  setPersistence(auth, browserLocalPersistence).catch(() => {});

  // All app data lives in one Firestore collection called "storage", one
  // document per key (e.g. "trips", "trip:abc123", "cover:abc123").
  // Every document is readable/writable only by the emails allowed in your
  // Firestore security rules — that's what makes this a private, 2-person app.
  function docIdFor(key){ return String(key).replace(/\//g, '_'); }

  function installStorageAdapter(){
    window.storage = {
      async get(key){
        const snap = await getDoc(doc(db, 'storage', docIdFor(key)));
        if(!snap.exists()) throw new Error('not-found');
        const data = snap.data();
        return { key, value: data.value, shared: true };
      },
      async set(key, value){
        await setDoc(doc(db, 'storage', docIdFor(key)), { key, value, updatedAt: Date.now() });
        return { key, value, shared: true };
      },
      async delete(key){
        await deleteDoc(doc(db, 'storage', docIdFor(key)));
        return { key, deleted: true, shared: true };
      },
      async list(prefix){
        // Not used by this app, kept only so nothing breaks if it's ever called.
        return { keys: [], prefix: prefix || '', shared: true };
      }
    };
  }

  function setLoginError(msg){ document.getElementById('login-error').textContent = msg; }

  document.getElementById('login-submit').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    setLoginError('');
    if(!email || !password){ setLoginError('メールアドレスとパスワードを入力してください。'); return; }
    try{
      await signInWithEmailAndPassword(auth, email, password);
    }catch(e){
      console.error('Firebase sign-in error:', e);
      setLoginError('ログインできませんでした（' + (e.code || e.message || 'unknown error') + '）。メールアドレスとパスワードをご確認ください。');
    }
  });
  document.getElementById('login-password').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('login-submit').click();
  });
  document.getElementById('logout-btn').addEventListener('click', () => { signOut(auth); });

  let appStarted = false;
  onAuthStateChanged(auth, (user) => {
    const gate = document.getElementById('login-gate');
    const appEl = document.querySelector('.app');
    if(user){
      gate.classList.add('hidden');
      if(appEl) appEl.classList.remove('hidden');
      if(!appStarted){
        appStarted = true;
        installStorageAdapter();
        if(window.appInit) window.appInit();
      }
    } else {
      gate.classList.remove('hidden');
      if(appEl) appEl.classList.add('hidden');
    }
  });
</script>
