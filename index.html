<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>TRIP NOTE</title>
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TRIP NOTE">
<!-- Deliberately NOT setting apple-mobile-web-app-capable here: enabling iOS's
     fullscreen "standalone" launch mode gives home-screen apps their own
     separate storage, which breaks the "stay signed in" behavior below. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     TRIP NOTE — iOS 26/27 "Liquid Glass" styling.
     Purely presentational: every class name, id and hook the app's
     JavaScript relies on is preserved exactly as before.
     =================================================================== */
  :root{
    color-scheme: light dark;

    --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
    --purple:#AF52DE; --pink:#FF2D55; --gray:#8E8E93;

    --bg:#F2F2F7;
    --app-bg:#F2F2F7;
    --surface:rgba(255,255,255,.72);
    --surface-solid:#FFFFFF;
    --surface-2:rgba(255,255,255,.72);
    --fill:rgba(120,120,128,.12);
    --fill-strong:rgba(120,120,128,.20);
    --border:rgba(60,60,67,.18);

    --text:#000000;
    --text-dim:rgba(60,60,67,.62);
    --text-tertiary:rgba(60,60,67,.32);
    --link:#007AFF;
    --danger:#FF3B30;

    --accent-blue:#007AFF; --accent-green:#34C759; --accent-orange:#FF9500;
    --accent-purple:#AF52DE; --accent-pink:#FF2D55;

    /* Liquid Glass material */
    --glass:rgba(255,255,255,.62);
    --glass-strong:rgba(255,255,255,.80);
    --glass-edge:rgba(255,255,255,.65);
    --glass-blur:saturate(180%) blur(28px);
    --glass-shadow:0 8px 32px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05);

    --radius:14px;
    --radius-lg:20px;
    --radius-xl:26px;
    --tab-h:58px;
    --tab-gap:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --app-bg:#000000;
      --surface:rgba(28,28,30,.72);
      --surface-solid:#1C1C1E;
      --surface-2:rgba(28,28,30,.72);
      --fill:rgba(118,118,128,.24);
      --fill-strong:rgba(118,118,128,.36);
      --border:rgba(84,84,88,.48);
      --text:#FFFFFF;
      --text-dim:rgba(235,235,245,.62);
      --text-tertiary:rgba(235,235,245,.32);
      --link:#0A84FF;
      --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
      --purple:#BF5AF2; --pink:#FF375F;
      --accent-blue:#0A84FF; --accent-green:#30D158; --accent-orange:#FF9F0A;
      --accent-purple:#BF5AF2; --accent-pink:#FF375F; --danger:#FF453A;
      --glass:rgba(40,40,44,.62);
      --glass-strong:rgba(44,44,48,.82);
      --glass-edge:rgba(255,255,255,.12);
      --glass-shadow:0 8px 32px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.30);
    }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro JP",
                "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:17px; line-height:1.45; letter-spacing:-0.4px;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  .heavy{ font-weight:700; letter-spacing:-0.6px; }
  .hidden{ display:none !important; }
  button, input, textarea, select{ font-family:inherit; letter-spacing:inherit; }
  button{ cursor:pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--blue); outline-offset:2px;
  }
  button:active{ opacity:.6; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  /* Inline SVG icons inherit text color and align with the text baseline */
  .ic{ display:inline-block; vertical-align:-0.18em; flex-shrink:0; }

  .app{ max-width:520px; margin:0 auto; min-height:100vh; background:var(--app-bg); position:relative; }

  /* ---------- Home ---------- */
  .home-header{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:12px; padding:16px 20px 12px;
  }
  .brand{ font-size:34px; font-weight:700; letter-spacing:-1.2px; line-height:1.1; }

  /* Glass segmented control */
  .home-tabs{
    display:flex; gap:3px; margin:4px 16px 18px; padding:3px;
    background:var(--fill); border-radius:16px;
  }
  .home-tab-btn{
    flex:1; padding:8px 10px; border:none; border-radius:13px;
    background:transparent; color:var(--text);
    font-size:14px; font-weight:600; letter-spacing:-0.2px;
    transition:background .25s cubic-bezier(.32,.72,0,1), box-shadow .25s ease;
  }
  .home-tab-btn.active{
    background:var(--glass-strong);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    box-shadow:0 2px 10px rgba(0,0,0,.10), inset 0 0 0 .5px var(--glass-edge);
  }

  #trip-list{ padding:0 16px 40px; }

  .trip-card{
    background:var(--surface);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    margin-bottom:18px; overflow:hidden; border-radius:var(--radius-xl);
    position:relative; box-shadow:var(--glass-shadow);
    transition:transform .25s cubic-bezier(.32,.72,0,1);
  }
  .trip-card:active{ transform:scale(.975); }
  .trip-photo{
    height:172px; background-color:var(--fill);
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .trip-photo-fallback{ display:flex; opacity:.95; }
  .trip-card-body{ padding:13px 17px 15px; position:relative; }
  .trip-card-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px; }
  .badge{
    font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px;
    background:rgba(0,122,255,.14); color:var(--blue); white-space:nowrap; letter-spacing:-0.1px;
  }
  .badge.past{ background:var(--fill); color:var(--text-dim); }
  .trip-location{
    font-size:13px; color:var(--text-dim); display:inline-flex; align-items:center; gap:4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trip-card-body h3{ font-size:20px; margin:0 0 3px; font-weight:700; letter-spacing:-0.6px; }
  .trip-dates{ font-size:14px; color:var(--text-dim); display:flex; align-items:center; gap:5px; }
  .trip-edit-icon{
    position:absolute; top:9px; right:9px; background:none; border:none;
    color:var(--blue); padding:7px; display:flex;
  }
  .empty-state{
    text-align:center; padding:46px 24px; color:var(--text-dim);
    background:var(--surface);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    border-radius:var(--radius-lg); font-size:15px; line-height:1.7; letter-spacing:-0.2px;
  }

  /* ---------- Buttons ---------- */
  .btn-outline{
    border:none; background:var(--fill); padding:9px 15px;
    border-radius:20px; font-size:15px; font-weight:600;
    color:var(--blue); white-space:nowrap; letter-spacing:-0.2px;
    display:inline-flex; align-items:center; gap:5px;
  }
  .btn-outline.small{ padding:6px 12px; font-size:13px; }
  .btn-outline.full{ width:100%; justify-content:center; display:flex; padding:13px; }
  .btn-primary{
    flex:1; background:var(--blue); color:#fff; border:none;
    padding:15px; border-radius:18px; font-size:17px; font-weight:600; letter-spacing:-0.4px;
    box-shadow:0 4px 14px rgba(0,122,255,.28);
  }
  .btn-secondary{
    flex:1; background:var(--fill); border:none; padding:15px;
    border-radius:18px; font-size:17px; color:var(--blue); font-weight:600; letter-spacing:-0.4px;
  }
  .btn-delete{
    background:none; border:none; color:var(--red); font-size:17px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin:16px auto 0; padding:10px;
  }
  .icon-only-btn{
    background:none; border:none; color:var(--blue);
    padding:8px; border-radius:50%; min-width:40px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .icon-only-btn.danger{ color:var(--red); }
  /* Floating glass controls over the hero image */
  .hero-icon-btn{
    position:absolute; top:14px; width:36px; height:36px; border-radius:50%;
    background:rgba(28,28,30,.34);
    -webkit-backdrop-filter:blur(18px) saturate(180%); backdrop-filter:blur(18px) saturate(180%);
    border:.5px solid rgba(255,255,255,.22); color:#fff; z-index:3;
    display:flex; align-items:center; justify-content:center;
  }
  .hero-back{ left:14px; } .hero-edit{ right:14px; }

  /* ---------- Trip detail ---------- */
  .detail-hero{
    position:relative; height:256px; overflow:hidden;
    background-size:cover; background-position:center;
  }
  .hero-fallback-icon{
    position:absolute; inset:0; display:none; align-items:center;
    justify-content:center; z-index:1; color:#fff; opacity:.95;
  }
  .hero-scrim{
    position:absolute; inset:0; z-index:2;
    background:linear-gradient(to top, rgba(0,0,0,.74), rgba(0,0,0,0) 62%);
  }
  .hero-title-wrap{ position:absolute; left:20px; right:20px; bottom:18px; z-index:3; }
  .hero-title-wrap h2{
    color:#fff; font-size:28px; margin:0; font-weight:700; letter-spacing:-0.9px;
    text-shadow:0 1px 14px rgba(0,0,0,.4);
  }
  .detail-info-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 20px; font-size:14px; color:var(--text-dim);
    background:var(--surface);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    flex-wrap:wrap; gap:8px;
  }
  .detail-info-row span{ display:inline-flex; align-items:center; gap:5px; }

  /* Floating Liquid Glass tab bar */
  .tab-bar{
    position:fixed; bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
    left:50%; transform:translateX(-50%);
    width:calc(100% - 28px); max-width:492px; z-index:60;
    display:flex; align-items:stretch;
    background:var(--glass);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    border:.5px solid var(--glass-edge);
    border-radius:var(--radius-xl);
    box-shadow:var(--glass-shadow);
    padding:5px 4px;
  }
  .tab-btn{
    flex:1; background:none; border:none; padding:6px 2px;
    font-size:10.5px; font-weight:500; letter-spacing:-0.1px;
    color:var(--text-dim); white-space:nowrap;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    border-radius:18px;
    transition:color .2s ease, background .25s cubic-bezier(.32,.72,0,1);
  }
  .tab-btn::before{
    content:''; width:23px; height:23px; display:block;
    background-color:currentColor;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    -webkit-mask-size:contain; mask-size:contain;
  }
  .tab-btn[data-tab="items"]::before{
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4.5' width='18' height='16' rx='4'/><path d='M3 9.5h18M8 2.8v3.4M16 2.8v3.4'/></svg>");
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4.5' width='18' height='16' rx='4'/><path d='M3 9.5h18M8 2.8v3.4M16 2.8v3.4'/></svg>");
  }
  .tab-btn[data-tab="spots"]::before{
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M12 21.5s7-6.3 7-11.4A7 7 0 0 0 5 10.1c0 5.1 7 11.4 7 11.4Z'/><circle cx='12' cy='10' r='2.6'/></svg>");
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M12 21.5s7-6.3 7-11.4A7 7 0 0 0 5 10.1c0 5.1 7 11.4 7 11.4Z'/><circle cx='12' cy='10' r='2.6'/></svg>");
  }
  .tab-btn[data-tab="costs"]::before{
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 4.5 12 12m5.5-7.5L12 12v7.6M8 12.7h8M8 16.2h8'/></svg>");
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 4.5 12 12m5.5-7.5L12 12v7.6M8 12.7h8M8 16.2h8'/></svg>");
  }
  .tab-btn[data-tab="prep"]::before{
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='3.5' y='7' width='17' height='13.5' rx='3.2'/><path d='M8.8 7V4.9a1.6 1.6 0 0 1 1.6-1.6h3.2a1.6 1.6 0 0 1 1.6 1.6V7M9.6 13.6l1.8 1.8 3.2-3.4'/></svg>");
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='3.5' y='7' width='17' height='13.5' rx='3.2'/><path d='M8.8 7V4.9a1.6 1.6 0 0 1 1.6-1.6h3.2a1.6 1.6 0 0 1 1.6 1.6V7M9.6 13.6l1.8 1.8 3.2-3.4'/></svg>");
  }
  .tab-btn[data-tab="memories"]::before{
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='5.5' width='18' height='14' rx='3.2'/><circle cx='8.6' cy='10.2' r='1.7'/><path d='m4 17.5 4.7-4.3a2 2 0 0 1 2.7 0l3 2.8m2-2.2a1.8 1.8 0 0 1 2.4.1l1.2 1.1'/></svg>");
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='5.5' width='18' height='14' rx='3.2'/><circle cx='8.6' cy='10.2' r='1.7'/><path d='m4 17.5 4.7-4.3a2 2 0 0 1 2.7 0l3 2.8m2-2.2a1.8 1.8 0 0 1 2.4.1l1.2 1.1'/></svg>");
  }
  .tab-btn.active{ color:var(--blue); font-weight:600; background:rgba(0,122,255,.12); }

  .tab-content{
    padding:16px;
    padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 40px);
  }
  .tab-toolbar-single{ margin-bottom:14px; }

  /* ---------- Item detail ---------- */
  .detail-topbar{
    display:flex; align-items:center; gap:2px; padding:9px 8px;
    background:var(--glass);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    border-bottom:.5px solid var(--border);
    position:sticky; top:0; z-index:40;
  }
  .detail-topbar-title{
    flex:1; font-size:17px; font-weight:600; letter-spacing:-0.4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    padding:0 6px; text-align:center;
  }
  .detail-page-content{ padding-bottom:48px; }
  .detail-icon-card{
    display:flex; align-items:center; gap:15px; background:var(--surface);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    border-radius:var(--radius-lg); padding:17px; margin:16px 16px 0;
    box-shadow:var(--glass-shadow);
  }
  .detail-icon-square{
    width:58px; height:58px; border-radius:18px; display:flex;
    align-items:center; justify-content:center; flex-shrink:0; color:#fff;
  }
  .detail-icon-title{ font-size:20px; font-weight:700; letter-spacing:-0.6px; line-height:1.25; }
  .detail-icon-type{ font-size:14px; margin-top:3px; font-weight:600; }

  .detail-info-card{
    background:var(--surface);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    border-radius:var(--radius-lg); padding:2px 17px; margin:18px 16px 0;
    overflow:hidden; box-shadow:var(--glass-shadow);
  }
  .detail-row{
    display:flex; justify-content:space-between; gap:16px; align-items:baseline;
    padding:13px 0; border-bottom:.5px solid var(--border); font-size:16px;
    letter-spacing:-0.3px;
  }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row-label{ color:var(--text-dim); flex-shrink:0; }
  .detail-row-value{ text-align:right; word-break:break-word; }
  .detail-map-wrap{ margin:18px 16px 0; }
  .map-embed{
    width:100%; height:196px; border:none; border-radius:var(--radius-lg); display:block;
  }
  .map-open-link{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:8px; color:var(--blue); font-size:16px;
    text-decoration:none; padding:13px; font-weight:500;
  }
  .detail-action-row{ margin:20px 16px 0; }

  /* ---------- Day pills / timeline ---------- */
  .day-pills-scroll{
    overflow-x:auto; margin:0 -16px 4px; padding:0 16px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .day-pills-scroll::-webkit-scrollbar{ display:none; }
  .day-pills{ display:flex; gap:8px; padding-bottom:6px; }
  .day-pill{
    flex-shrink:0; width:56px; padding:9px 4px; border-radius:18px;
    background:var(--surface);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    border:none; color:var(--text-dim); text-align:center;
    display:flex; flex-direction:column; gap:1px;
    transition:transform .2s cubic-bezier(.32,.72,0,1), background .2s ease;
  }
  .day-pill:active{ transform:scale(.93); }
  .day-pill-wd{ font-size:11px; font-weight:500; }
  .day-pill-num{ font-size:19px; font-weight:600; letter-spacing:-0.4px; color:var(--text); }
  .day-pill.active{ background:var(--blue); box-shadow:0 4px 14px rgba(0,122,255,.30); }
  .day-pill.active .day-pill-wd, .day-pill.active .day-pill-num{ color:#fff; }

  .tl-row{ display:flex; gap:10px; }
  .tl-time{
    width:46px; flex-shrink:0; font-size:13px; color:var(--text-dim);
    padding-top:17px; text-align:right; font-variant-numeric:tabular-nums;
  }
  .tl-line-wrap{ display:flex; flex-direction:column; align-items:center; width:14px; flex-shrink:0; }
  .tl-dot{ width:10px; height:10px; border-radius:50%; margin-top:20px; flex-shrink:0; }
  .tl-line{ flex:1; width:2px; background:var(--border); margin-top:3px; }
  .tl-row:last-child .tl-line{ display:none; }
  .tl-card{
    flex:1; background:var(--surface);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    border:none; border-radius:var(--radius-lg); padding:14px 15px;
    margin-bottom:12px; min-width:0; box-shadow:var(--glass-shadow);
    transition:transform .2s cubic-bezier(.32,.72,0,1);
  }
  .tl-card:active{ transform:scale(.975); }
  .tl-card-head{ display:flex; align-items:center; gap:11px; }
  .tl-icon{
    width:32px; height:32px; border-radius:11px; display:flex;
    align-items:center; justify-content:center; flex-shrink:0; color:#fff;
  }
  .tl-title{
    flex:1; font-size:16px; font-weight:600; letter-spacing:-0.4px; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tl-endtime{ font-size:13px; color:var(--text-dim); flex-shrink:0; font-variant-numeric:tabular-nums; }
  .tl-place{ font-size:14px; color:var(--text-dim); margin-top:8px; display:flex; align-items:center; gap:5px; }
  .tl-memo{ font-size:14px; color:var(--text-dim); margin-top:6px; }
  .tl-cost{ font-size:14px; font-weight:600; margin-top:8px; text-align:right; }

  /* ---------- Spots ---------- */
  .spot-section-title{
    font-size:13px; color:var(--text-dim); margin:0 0 8px 4px;

    clip:"<path d='M20 11.4 12.3 19a4.6 4.6 0 0 1-6.5-6.5l7.9-7.8a3 3 0 0 1 4.3 4.3l-7.8 7.8a1.4 1.4 0 0 1-2-2l7.2-7.2'/>",
    trash:"<path d='M4 6.6h16M9.4 6.6V4.9a1.4 1.4 0 0 1 1.4-1.4h2.4a1.4 1.4 0 0 1 1.4 1.4v1.7'/><path d='M6.2 6.6 7.2 19a2 2 0 0 0 2 1.9h5.6a2 2 0 0 0 2-1.9l1-12.4'/><path d='M10.3 10.4v6.4M13.7 10.4v6.4'/>",
    pencil:"<path d='M16.6 3.6a2.3 2.3 0 0 1 3.3 3.3L8.2 18.6l-4.3 1 1-4.3Z'/><path d='m14.6 5.6 3.3 3.3'/>",

  function icon(name, size){
    const s = size || 20;
    return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ICON_PATHS.pin}</svg>`;
  }
  /* Trip cover icons: accepts a new key or a legacy emoji from saved data. */
  const LEGACY_TRIP_ICON = {
    '\u2708\ufe0f':'plane', '\ud83c\udfd6\ufe0f':'beach', '\u26f0\ufe0f':'mountain',
    '\ud83c\udfd9\ufe0f':'city', '\ud83d\ude97':'car', '\ud83d\ude84':'train',
    '\u26f4\ufe0f':'ship', '\ud83c\udfd5\ufe0f':'tent'
  };
  function tripIconKey(v){
    if(!v) return 'plane';
    return ICON_PATHS[v] ? v : (LEGACY_TRIP_ICON[v] || 'plane');
  }
  function tripIcon(v, size){ return icon(tripIconKey(v), size || 20); }


  /* ---------- Time zones ----------
     Every item stores the times exactly as they were typed, plus which zone
     those times belong to (tzMode: 'jst' | 'local'). The trip stores the
     local UTC offset. Ordering uses the absolute instant, so a flight that
     lands "earlier" than it departed still sorts correctly.                */
  const HOME_TZ = 540;                       // Japan, UTC+9
  const TZ_OPTIONS = [
    { v:-660, ja:'ミッドウェー (UTC-11)',        en:'Midway (UTC-11)' },
    { v:-600, ja:'ホノルル (UTC-10)',            en:'Honolulu (UTC-10)' },
    { v:-540, ja:'アンカレジ (UTC-9)',           en:'Anchorage (UTC-9)' },
    { v:-480, ja:'ロサンゼルス・バンクーバー (UTC-8)', en:'Los Angeles (UTC-8)' },
    { v:-420, ja:'デンバー (UTC-7)',             en:'Denver (UTC-7)' },
    { v:-360, ja:'シカゴ・メキシコシティ (UTC-6)', en:'Chicago (UTC-6)' },
    { v:-300, ja:'ニューヨーク・トロント (UTC-5)', en:'New York (UTC-5)' },
    { v:-240, ja:'サンティアゴ (UTC-4)',         en:'Santiago (UTC-4)' },
    { v:-180, ja:'サンパウロ (UTC-3)',           en:'São Paulo (UTC-3)' },
    { v:0,    ja:'ロンドン (UTC+0)',             en:'London (UTC+0)' },
    { v:60,   ja:'パリ・ローマ・ベルリン (UTC+1)', en:'Paris (UTC+1)' },
    { v:120,  ja:'カイロ・ヘルシンキ (UTC+2)',    en:'Cairo (UTC+2)' },
    { v:180,  ja:'モスクワ・イスタンブール (UTC+3)', en:'Moscow (UTC+3)' },
    { v:240,  ja:'ドバイ (UTC+4)',               en:'Dubai (UTC+4)' },
    { v:330,  ja:'デリー・ムンバイ (UTC+5:30)',   en:'Delhi (UTC+5:30)' },
    { v:420,  ja:'バンコク・ジャカルタ (UTC+7)',  en:'Bangkok (UTC+7)' },
    { v:480,  ja:'シンガポール・台北・香港 (UTC+8)', en:'Singapore (UTC+8)' },
    { v:540,  ja:'日本・ソウル (UTC+9)',          en:'Japan / Seoul (UTC+9)' },
    { v:600,  ja:'シドニー・グアム (UTC+10)',     en:'Sydney (UTC+10)' },
    { v:720,  ja:'オークランド (UTC+12)',         en:'Auckland (UTC+12)' }
  ];
  function tzLabel(v){
    const o = TZ_OPTIONS.find(x => x.v === v);
    if(o) return o[LANG] || o.ja;
    const s = v < 0 ? '-' : '+';
    const a = Math.abs(v);

    const tr = trips.find(x => x.id === (tripId || currentTripId));
    return (tr && typeof tr.tzOffset === 'number') ? tr.tzOffset : HOME_TZ;

  function timeToMinutes(tm){
    if(!tm) return null;
    const p = String(tm).split(':');
    return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0);
  }
  function minutesToTime(mins){
    const m = ((mins % 1440) + 1440) % 1440;
    return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');

    if(!it || !it.date) return 0;
    const dayStart = Date.parse(it.date + 'T00:00:00Z') / 60000;
    const tm = timeToMinutes(it.startTime);
    return dayStart + (tm === null ? 0 : tm) - itemZoneOffset(it);
  }

    const d = absMinutes(a) - absMinutes(b);

    return (a.startTime || '').localeCompare(b.startTime || '');

  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function positionDatePickerPopup(btn){
    const rect = btn.getBoundingClientRect();
    const popup = document.getElementById('date-picker-popup');

    let top = rect.bottom + 6;
    let left = rect.left;
    if(left + popupWidth > window.innerWidth - 10) left = window.innerWidth - popupWidth - 10;
    if(left < 10) left = 10;
    if(top + popupHeightEstimate > window.innerHeight - 10){
      top = rect.top - popupHeightEstimate - 6;

    popup.style.top = top + 'px';

  function renderDatePickerCalendar(){
    document.getElementById('date-picker-title').textContent = monthTitle(datePickerViewYear, datePickerViewMonth);
    const firstDay = new Date(datePickerViewYear, datePickerViewMonth, 1);
    const offset = (firstDay.getDay() + 6) % 7;

    const todayStr = formatISODate(new Date());
    const singleSelected = datePickerMode === 'single' ? document.getElementById(datePickerTarget).dataset.value : null;
    let cells = '';
    for(let i=0; i<offset; i++) cells += `<div class="dp-cell dp-empty"></div>`;

      let cls = 'dp-cell dp-day';

  /* ---------- Swipe between tabs ----------
     The content tracks the finger 1:1 while dragging, then either completes
     the switch (old view slides out, new one slides in) or springs back.   */
  const TAB_ORDER = ['items', 'spots', 'costs', 'prep', 'memories'];
  const SWIPE_COMMIT_PX = 64;      // past this, the switch commits
  const SWIPE_OUT_MS = 170;        // old content leaving
  const SWIPE_IN_MS = 250;         // new content arriving
  let tabTouchStartX = 0, tabTouchStartY = 0;
  let tabTouchStartedInScroller = false;
  let tabDragging = false, tabDragLocked = false, tabAnimating = false;

  function reduceMotion(){
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  function tabEl(){ return document.getElementById('tab-content'); }
  function setTabTransform(dx, opacity){
    const el = tabEl();
    if(!el) return;
    el.style.transform = dx ? `translate3d(${dx}px,0,0)` : 'translate3d(0,0,0)';
    el.style.opacity = (opacity === undefined) ? '' : String(opacity);
  }
  function clearTabTransform(){
    const el = tabEl();
    if(!el) return;
    el.style.transform = '';
    el.style.opacity = '';
  }
  function canGoTab(dir){
    const i = TAB_ORDER.indexOf(currentTab);
    return dir > 0 ? i < TAB_ORDER.length - 1 : i > 0;
  }

  /* Animate across to another tab. dir: 1 = forward (content enters from the
     right), -1 = back. Used by both the swipe gesture and the tab bar. */
  function switchTab(newTab, dir){
    if(!newTab || newTab === currentTab || tabAnimating) return;
    if(dir === undefined){
      dir = TAB_ORDER.indexOf(newTab) > TAB_ORDER.indexOf(currentTab) ? 1 : -1;
    }
    const el = tabEl();
    if(!el || reduceMotion()){
      currentTab = newTab; renderTabContent(); clearTabTransform(); return;
    }
    tabAnimating = true;
    const w = el.offsetWidth || 360;
    const out = Math.round(w * 0.30);
    const inFrom = Math.round(w * 0.22);

    el.classList.add('tc-anim');
    setTabTransform(-dir * out, 0);                 // leave in the swipe direction

    setTimeout(() => {
      currentTab = newTab;
      renderTabContent();                            // swap content while invisible
      el.classList.remove('tc-anim');
      setTabTransform(dir * inFrom, 0);              // park it on the far side
      void el.offsetWidth;                           // commit that frame
      el.classList.add('tc-anim');
      setTabTransform(0, 1);                         // ...then glide into place
      setTimeout(() => {
        el.classList.remove('tc-anim');
        clearTabTransform();
        tabAnimating = false;
      }, SWIPE_IN_MS);
    }, SWIPE_OUT_MS);
  }

  function onTabContentTouchStart(e){
    if(tabAnimating || !e.touches || !e.touches.length) return;
    const t = e.touches[0];
    tabTouchStartX = t.clientX; tabTouchStartY = t.clientY;
    tabTouchStartedInScroller = !!(e.target.closest && e.target.closest('.day-pills-scroll'));
    tabDragging = false; tabDragLocked = false;
    const el = tabEl();
    if(el) el.classList.remove('tc-anim');           // follow the finger exactly
  }

  function onTabContentTouchMove(e){
    if(tabAnimating || tabTouchStartedInScroller || tabDragLocked) return;
    if(!e.touches || !e.touches.length) return;
    const t = e.touches[0];
    const dx = t.clientX - tabTouchStartX;
    const dy = t.clientY - tabTouchStartY;
    if(!tabDragging){
      if(Math.abs(dx) < 12 && Math.abs(dy) < 12) return;   // too small to judge yet
      if(Math.abs(dx) < Math.abs(dy) * 1.2){ tabDragLocked = true; return; }  // vertical scroll wins
      tabDragging = true;
    }
    if(e.cancelable) e.preventDefault();             // the gesture is ours now
    const dir = dx < 0 ? 1 : -1;
    const resist = canGoTab(dir) ? 0.55 : 0.16;      // rubber-band at the ends
    const shift = dx * resist;
    setTabTransform(shift, 1 - Math.min(Math.abs(shift) / 260, 0.55));
  }

  function onTabContentTouchEnd(e){
    const el = tabEl();
    if(tabAnimating || tabTouchStartedInScroller) return;
    if(!tabDragging || tabDragLocked){ clearTabTransform(); return; }
    tabDragging = false;
    const t = (e.changedTouches && e.changedTouches.length) ? e.changedTouches[0] : null;
    const dx = t ? (t.clientX - tabTouchStartX) : 0;
    const dir = dx < 0 ? 1 : -1;
    const idx = TAB_ORDER.indexOf(currentTab);
    if(Math.abs(dx) >= SWIPE_COMMIT_PX && canGoTab(dir)){
      switchTab(TAB_ORDER[idx + dir], dir);
    } else if(el){
      el.classList.add('tc-anim');                   // spring back
      setTabTransform(0, 1);
      setTimeout(() => { el.classList.remove('tc-anim'); clearTabTransform(); }, 240);
    }
  }

  /* ---------- Items (itinerary) tab ---------- */
  function selectDay(d){ selectedDay = d; renderItemsTab(); }
  function renderItemsTab(){
    const trip = trips.find(x => x.id === currentTripId);
    const data = tripDataCache[currentTripId];
    const days = buildDayList(trip);
    if(!selectedDay || !days.includes(selectedDay)) selectedDay = days[0];
    const dayItems = data.items.filter(it => selectedDay >= it.date && selectedDay <= (it.endDate || it.date)).slice().sort(byInstant);
    let html = `
      <div class="day-pills-scroll"><div class="day-pills">
        ${days.map(d => {
          const { wd, day } = dayPillLabel(d);
          return `<button type="button" class="day-pill ${d===selectedDay?'active':''}" onclick="selectDay('${d}')"><span class="day-pill-wd">${wd}</span><span class="day-pill-num">${day}</span></button>`;
        }).join('')}
      </div></div>
    `;
    if(dayItems.length === 0){ html += `<div class="empty-state">${t('itemEmptyDay')}</div>`; }
    else { html += dayItems.map(it => renderTimelineRow(it)).join(''); }
    document.getElementById('tab-content').innerHTML = html;

  /* ---------- Item modal ---------- */

    document.getElementById('item-form-end-time').value = item ? (item.endTime || '') : '';
    document.getElementById('item-form-place').value = item ? (item.place || '') : '';
    document.getElementById('item-form-contact').value = item ? (item.contact || '') : '';
    document.getElementById('item-form-checkin').value = item ? (item.checkIn || '') : '';
    document.getElementById('item-form-checkout').value = item ? (item.checkOut || '') : '';
    document.getElementById('item-form-url').value = item ? (item.url || '') : '';
    document.getElementById('item-form-cost').value = item && item.cost ? item.cost : '';
    document.getElementById('item-form-paid').checked = item ? !!item.paid : false;
    document.getElementById('item-form-memo').value = item ? (item.memo || '') : '';

    renderTypeChips('item-type-picker', selectedItemType, ty => { selectedItemType = ty; });
    document.getElementById('item-delete-btn').style.display = editingItemId ? 'block' : 'none';
    renderItemTzToggle();
    renderItemCoverPreview();
    renderAttachmentPreview();
    openModal('item-modal');
    if(item && item.id && item.hasCover && !itemCoverCache[item.id]){
      fetchItemCover(item.id).then(url => {
        if(url && editingItemId === item.id){ existingItemCoverDataUrl = url; renderItemCoverPreview(); }
      });

  function renderAttachmentPreview(){
    const el = document.getElementById('attachment-preview');
    if(pendingAttachment){
      el.innerHTML = `<div class="attachment-chip"><span class="attachment-name">${icon('clip',15)}${escapeHtml(pendingAttachment.name)}</span><button type="button" class="delete-btn" onclick="clearPendingAttachment()">${icon('close',17)}</button></div>`;
    } else if(existingAttachmentMeta && !removeAttachmentFlag){
      el.innerHTML = `<div class="attachment-chip"><span class="attachment-name">${icon('clip',15)}${escapeHtml(existingAttachmentMeta.name)}</span><button type="button" class="btn-outline small" onclick="openAttachment('${editingItemId}')">${t('open')}</button><button type="button" class="delete-btn" onclick="markRemoveAttachment()">${icon('close',17)}</button></div>`;
    } else {
      el.innerHTML = `<div class="attachment-empty">${t('attachmentEmpty')}</div>`;
    }
  }
  function handleAttachmentFile(input){
    const file = input.files[0];
    if(!file) return;
    if(file.size > MAX_ATTACHMENT_BYTES){ alert(t('alertFileTooBig')); input.value = ''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      pendingAttachment = { name: file.name, type: file.type, dataUrl: reader.result };
      removeAttachmentFlag = false;
      renderAttachmentPreview();
    };
    reader.onerror = () => { alert(t('alertFileFailed')); };
    reader.readAsDataURL(file);
  }
  function clearPendingAttachment(){ pendingAttachment = null; document.getElementById('item-form-file').value = ''; renderAttachmentPreview(); }
  function markRemoveAttachment(){ removeAttachmentFlag = true; renderAttachmentPreview(); }
  async function saveItemForm(){
    const title = val('item-form-title').trim();
    const itemDateBtn = document.getElementById('item-form-date');
    const date = itemDateBtn.dataset.start || '';
    const endDate = itemDateBtn.dataset.end || date;
    if(!title || !date){ alert(t('alertItemRequired')); return; }
    const startTime = val('item-form-start-time');
    const endTime = val('item-form-end-time');
    const place = val('item-form-place').trim();
    const contact = val('item-form-contact').trim();
    const checkIn = val('item-form-checkin').trim();
    const checkOut = val('item-form-checkout').trim();
    const url = val('item-form-url').trim();
    const cost = Number(val('item-form-cost')) || 0;
    const paid = document.getElementById('item-form-paid').checked;
    const memo = val('item-form-memo').trim();
    const data = tripDataCache[currentTripId];
    let item, itemId;
    if(editingItemId){
      item = data.items.find(i => i.id === editingItemId);
      itemId = editingItemId;
      Object.assign(item, { title, type: selectedItemType, date, endDate, startTime, endTime, tzMode: selectedItemTz, place, contact, checkIn, checkOut, url, cost, paid, memo });
    } else {
      itemId = uid();
      item = { id: itemId, title, type: selectedItemType, date, endDate, startTime, endTime, tzMode: selectedItemTz, place, contact, checkIn, checkOut, url, cost, paid, memo, hasAttachment: false, hasCover: false };
      data.items.push(item);
    }
    if(pendingAttachment){
      try{
        await window.storage.set('attachment:'+itemId, JSON.stringify(pendingAttachment), true);
        item.hasAttachment = true; item.attachmentName = pendingAttachment.name; item.attachmentType = pendingAttachment.type;
      }catch(e){ alert(t('alertAttachmentFailed')); }
    } else if(removeAttachmentFlag){
      await deleteAttachmentStorage(itemId);
      item.hasAttachment = false; delete item.attachmentName; delete item.attachmentType;
    }
    if(pendingItemCover){
      try{
        await window.storage.set('itemcover:' + itemId, pendingItemCover, true);
        item.hasCover = true; itemCoverCache[itemId] = pendingItemCover;
      }catch(e){ alert(t('alertCoverFailed')); }
    } else if(removeItemCoverFlag){
      await deleteItemCoverStorage(itemId);
      item.hasCover = false;
    }
    let cameFromCandidate = false;
    if(promotingFromCandidateId){
      data.candidates = data.candidates.filter(c => c.id !== promotingFromCandidateId);
      cameFromCandidate = true;
    }
    await saveTripData(currentTripId);
    closeModal('item-modal');
    if(!document.getElementById('screen-item-detail').classList.contains('hidden') && currentDetailItemId === itemId){
      renderItemDetail(item);
    } else {
      renderTabContent();
    }
    if(cameFromCandidate && currentTab === 'spots') renderSpotsTab();
    showToast(t('saved'));
  }
  async function deleteItem(){
    if(!editingItemId) return;
    if(!confirm(t('confirmDeleteItem'))) return;
    const data = tripDataCache[currentTripId];
    const it = data.items.find(i => i.id === editingItemId);
    const wasDetailOpen = !document.getElementById('screen-item-detail').classList.contains('hidden') && currentDetailItemId === editingItemId;
    data.items = data.items.filter(i => i.id !== editingItemId);
    await saveTripData(currentTripId);
    if(it && it.hasAttachment) await deleteAttachmentStorage(it.id);
    if(it && it.hasCover) await deleteItemCoverStorage(it.id);
    closeModal('item-modal');
    if(wasDetailOpen){ closeItemDetail(); } else { renderTabContent(); }
    showToast(t('deleted'));
  }

  /* ---------- Spots tab ---------- */
  function openSpotsMap(){
    const data = tripDataCache[currentTripId];
    const scheduledPlaces = data.items.filter(it => it.place).slice().sort(byInstant).map(it => it.place);
    const candidatePlaces = data.candidates.filter(c => c.place).map(c => c.place);
    const places = scheduledPlaces.concat(candidatePlaces);
    if(places.length === 0){ alert(t('alertNoMapPlaces')); return; }
    window.open('https://www.google.com/maps/dir/' + places.map(p => encodeURIComponent(p)).join('/'), '_blank');
  }
  function renderSpotsTab(){
    const trip = trips.find(x => x.id === currentTripId);
    const data = tripDataCache[currentTripId];
    const scheduled = data.items.filter(it => it.place).slice().sort(byInstant);
    let html = `<button type="button" class="btn-outline full" onclick="openSpotsMap()">${icon('map',17)}${t('mapShow')}</button>`;
    html += `<div class="spot-section-title" style="margin-top:22px;">${t('scheduledSpots')} <span class="spot-count">${scheduled.length}</span></div>`;
    if(scheduled.length === 0){ html += `<div class="empty-state">${t('noScheduledSpots')}</div>`; }
    else {
      html += scheduled.map(it => {
        const info = typeInfo(it.type);
        const dayIndexStart = Math.floor((new Date(it.date+'T00:00:00') - new Date(trip.start+'T00:00:00')) / 86400000) + 1;
        const dayIndexEnd = it.endDate ? Math.floor((new Date(it.endDate+'T00:00:00') - new Date(trip.start+'T00:00:00')) / 86400000) + 1 : dayIndexStart;
        return `
          <div class="spot-card" onclick="openItemDetail('${it.id}')">
            <div class="spot-icon" style="background:${info.color}">${icon(info.icon, 18)}</div>
            <div class="spot-body">
              <div class="spot-title">${escapeHtml(it.title)}</div>
              <div class="spot-address">${escapeHtml(it.place)}</div>
              <div class="spot-tag">${t('dayRangeOf', dayIndexStart, dayIndexEnd)} ${it.startTime||''}</div>
            </div>
            ${itemCoverCache[it.id] ? `<img class="spot-thumb" src="${itemCoverCache[it.id]}" alt="">` : ''}
            <div class="spot-chevron">${icon('chevronRight',18)}</div>
          </div>
        `;
      }).join('');
    }
    html += `<div class="spot-section-title" style="margin-top:28px;">${t('candidateSpots')} <span class="spot-count">${data.candidates.length}</span></div>`;
    if(data.candidates.length === 0){ html += `<div class="empty-state">${t('noCandidateSpots')}</div>`; }
    else {
      html += data.candidates.map(c => {
        const info = typeInfo(c.type);
        return `
          <div class="spot-card" onclick="promoteCandidate('${c.id}')">
            <div class="spot-icon" style="background:${info.color}">${icon(info.icon, 18)}</div>
            <div class="spot-body">
              <div class="spot-title">${escapeHtml(c.title)}</div>
              ${c.place ? `<div class="spot-address">${escapeHtml(c.place)}</div>` : ''}
            </div>
            <button type="button" class="spot-remove" onclick="event.stopPropagation(); deleteCandidateDirect('${c.id}')">${icon('close',17)}</button>
          </div>
        `;
      }).join('');
    }
    document.getElementById('tab-content').innerHTML = html;
  }

  function buildChecklistHtml(data){
    const total = data.checklist.length;
    const checked = data.checklist.filter(c => c.checked).length;
    const pct = total ? Math.round(checked / total * 100) : 0;
    const otherLabel = LANG === 'en' ? 'Other' : 'その他';
    const categories = [...new Set(data.checklist.map(c => c.category || otherLabel))];
    let html = `
      <div class="checklist-add-row">
        <select id="checklist-category-input" onchange="onCategorySelectChange()">
          ${categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
          <option value="__new__">${t('newCategoryOption')}</option>
        </select>
        <input type="text" id="checklist-input" placeholder="${t('checklistItemPlaceholder')}" onkeydown="if(event.key==='Enter') addChecklistItem()">
        <button type="button" class="btn-outline" onclick="addChecklistItem()">${icon('plus',18)}</button>
      </div>
      <div class="progress-row"><span>${checked} / ${total}</span><span>${pct}%</span></div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    `;
    if(data.checklist.length === 0){ html += `<div class="empty-state">${t('checklistEmpty')}</div>`; }
    else {
      html += groupChecklistByLabel(data.checklist, otherLabel).map(g => `

          ${g.items.map(c => `
            <div class="checklist-row">
              <div class="sq-checkbox ${c.checked?'checked':''}" onclick="toggleChecklistItem('${c.id}')">${c.checked?icon('check',15):''}</div>
              <div class="checklist-text ${c.checked?'done':''}" data-id="${c.id}" onclick="editChecklistItemInline('${c.id}')">${escapeHtml(c.text)}</div>
              <button type="button" class="delete-btn" onclick="deleteChecklistItem('${c.id}')">${icon('close',17)}</button>
            </div>
          `).join('')}
        </div>
      `).join('');
    }
    return html;
  }
  function groupChecklistByLabel(items, otherLabel){
    const order = []; const map = {};
    items.forEach(it => {
      const cat = it.category || otherLabel;
      if(!map[cat]){ map[cat] = []; order.push(cat); }
      map[cat].push(it);
    });
    return order.map(cat => ({ cat, items: map[cat] }));
  }
  function onCategorySelectChange(){
    const sel = document.getElementById('checklist-category-input');
    if(sel.value === '__new__'){
      const name = (prompt(t('newCategoryPrompt')) || '').trim();
      if(name){
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        sel.insertBefore(opt, sel.lastElementChild);
        sel.value = name;
      } else {
        sel.selectedIndex = 0;
      }
    }
  }
  async function addChecklistItem(){
    const input = document.getElementById('checklist-input');
    const sel = document.getElementById('checklist-category-input');
    const text = input.value.trim();
    if(!text) return;
    const otherLabel = LANG === 'en' ? 'Other' : 'その他';
    const category = (sel.value && sel.value !== '__new__') ? sel.value : otherLabel;
    tripDataCache[currentTripId].checklist.push({ id: uid(), text, checked: false, category });
    input.value = '';
    await saveTripData(currentTripId);
    renderPrepTab();
    const refocus = document.getElementById('checklist-input');
    if(refocus) refocus.focus();
  }
  async function toggleChecklistItem(id){
    const item = tripDataCache[currentTripId].checklist.find(c => c.id === id);
    item.checked = !item.checked;
    await saveTripData(currentTripId);
    renderPrepTab();
  }
  async function deleteChecklistItem(id){
    const data = tripDataCache[currentTripId];
    data.checklist = data.checklist.filter(c => c.id !== id);
    await saveTripData(currentTripId);
    renderPrepTab();
  }
  function editChecklistItemInline(id){
    const data = tripDataCache[currentTripId];
    const item = data.checklist.find(c => c.id === id);
    if(!item) return;
    const textEl = document.querySelector(`.checklist-text[data-id="${id}"]`);
    if(!textEl) return;
    let cancelled = false;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'checklist-edit-input';
    input.value = item.text;
    textEl.replaceWith(input);
    input.focus();
    input.select();
    input.addEventListener('blur', async () => {
      if(cancelled) return;
      const newText = input.value.trim();
      if(newText && newText !== item.text){
        item.text = newText;
        await saveTripData(currentTripId);
      }
      renderPrepTab();
    });
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ input.blur(); }
      else if(e.key === 'Escape'){ cancelled = true; renderPrepTab(); }
    });
  }
  function buildNotesHtml(data){
    let html = '';
    if(data.notes.length === 0){ html += `<div class="empty-state">${t('notesEmpty')}</div>`; }
    else {
      const sorted = data.notes.slice().sort((a,b) => b.createdAt - a.createdAt);
      html += sorted.map(n => `
        <div class="note-card" onclick="editNoteById('${n.id}')">
          <div class="note-text">${escapeHtml(n.text)}</div>
          <div class="note-date">${formatDateTime(n.createdAt)}</div>
        </div>
      `).join('');
    }
    return html;
  }
  function editNoteById(id){ openNoteModal(tripDataCache[currentTripId].notes.find(n => n.id === id)); }
  function openNoteModal(note){
    editingNoteId = note ? note.id : null;
    document.getElementById('note-modal-title').textContent = note ? t('editNote') : t('newNote');
    document.getElementById('note-form-text').value = note ? note.text : '';
    document.getElementById('note-delete-btn').style.display = note ? 'block' : 'none';
    openModal('note-modal');
  }
  async function saveNoteForm(){
    const text = val('note-form-text').trim();
    if(!text) return;
    const data = tripDataCache[currentTripId];
    if(editingNoteId){ data.notes.find(n => n.id === editingNoteId).text = text; }
    else { data.notes.push({ id: uid(), text, createdAt: Date.now() }); }
    await saveTripData(currentTripId);
    closeModal('note-modal');
    renderPrepTab();
    showToast(t('saved'));
  }
  async function deleteNote(){
    if(!editingNoteId) return;
    if(!confirm(t('confirmDeleteNote'))) return;
    const data = tripDataCache[currentTripId];
    data.notes = data.notes.filter(n => n.id !== editingNoteId);
    await saveTripData(currentTripId);
    closeModal('note-modal');
    renderPrepTab();
    showToast(t('deleted'));
  }

  /* ---------- Memories tab ---------- */
  function renderMemoriesTab(){
    const data = tripDataCache[currentTripId];
    let html = '';
    if(data.memories.length === 0){ html += `<div class="empty-state">${t('memoriesEmpty')}</div>`; }
    else {
      const sorted = data.memories.slice().sort((a,b) => b.createdAt - a.createdAt);
      html += sorted.map(m => `
        <div class="memory-card" onclick="editMemoryById('${m.id}')">
          ${m.photo ? `<img class="memory-photo" src="${m.photo}">` : ''}
          ${m.text ? `<div class="memory-text">${escapeHtml(m.text)}</div>` : ''}
          <div class="note-date">${formatDateTime(m.createdAt)}</div>
        </div>
      `).join('');
    }
    document.getElementById('tab-content').innerHTML = html;
  }
  function editMemoryById(id){ openMemoryModal(tripDataCache[currentTripId].memories.find(m => m.id === id)); }
  function openMemoryModal(memory){
    editingMemoryId = memory ? memory.id : null;
    pendingMemoryPhoto = memory ? (memory.photo || null) : null;
    document.getElementById('memory-form-file').value = '';
    document.getElementById('memory-modal-title').textContent = memory ? t('editMemory') : t('newMemory');
    document.getElementById('memory-form-text').value = memory ? (memory.text || '') : '';
    document.getElementById('memory-delete-btn').style.display = memory ? 'block' : 'none';
    renderMemoryPhotoPreview();
    openModal('memory-modal');
  }
  function renderMemoryPhotoPreview(){
    const el = document.getElementById('memory-photo-preview');
    el.innerHTML = pendingMemoryPhoto ? `<div class="cover-preview-wrap"><img src="${pendingMemoryPhoto}"><button type="button" class="delete-btn cover-remove-btn" onclick="removeMemoryPhoto()">${icon('close',16)}</button></div>` : '';
  }
  async function handleMemoryFile(input){
    const file = input.files[0];
    if(!file) return;
    try{ pendingMemoryPhoto = await compressImage(file, 800, 0.6); renderMemoryPhotoPreview(); }
    catch(e){ alert(t('alertImageFailed')); }
  }
  function removeMemoryPhoto(){ pendingMemoryPhoto = null; document.getElementById('memory-form-file').value = ''; renderMemoryPhotoPreview(); }
  async function saveMemoryForm(){
    const text = val('memory-form-text').trim();
    if(!text && !pendingMemoryPhoto){ alert(t('alertMemoryRequired')); return; }
    const data = tripDataCache[currentTripId];
    if(editingMemoryId){ const m = data.memories.find(m => m.id === editingMemoryId); m.text = text; m.photo = pendingMemoryPhoto; }
    else { data.memories.push({ id: uid(), text, photo: pendingMemoryPhoto, createdAt: Date.now() }); }
    await saveTripData(currentTripId);
    closeModal('memory-modal');
    renderMemoriesTab();
    showToast(t('saved'));
  }
  async function deleteMemory(){
    if(!editingMemoryId) return;
    if(!confirm(t('confirmDeleteMemory'))) return;
    const data = tripDataCache[currentTripId];
    data.memories = data.memories.filter(m => m.id !== editingMemoryId);
    await saveTripData(currentTripId);
    closeModal('memory-modal');
    renderMemoriesTab();
    showToast(t('deleted'));
  }

  /* ---------- Init ---------- */
  function setupListeners(){
    document.getElementById('back-btn').addEventListener('click', () => { goHome(); });
    document.getElementById('edit-trip-btn').addEventListener('click', () => openTripModal(trips.find(x => x.id === currentTripId)));
    document.querySelectorAll('.tab-btn').forEach(btn => { btn.addEventListener('click', () => switchTab(btn.dataset.tab)); });
    const tc = document.getElementById('tab-content');
    tc.addEventListener('touchstart', onTabContentTouchStart, { passive: true });
    // Not passive: a confirmed horizontal drag calls preventDefault so the
    // page doesn't try to scroll underneath the gesture.
    tc.addEventListener('touchmove', onTabContentTouchMove, { passive: false });
    tc.addEventListener('touchend', onTabContentTouchEnd, { passive: true });
    tc.addEventListener('touchcancel', onTabContentTouchEnd, { passive: true });
    document.getElementById('item-detail-back').addEventListener('click', closeItemDetail);
    document.getElementById('item-detail-edit').addEventListener('click', editCurrentDetailItem);
    document.getElementById('item-detail-delete').addEventListener('click', deleteCurrentDetailItem);
    document.getElementById('trip-form-cancel').addEventListener('click', () => closeModal('trip-modal'));
    document.getElementById('trip-form-save').addEventListener('click', saveTripForm);
    document.getElementById('trip-delete-btn').addEventListener('click', deleteTrip);
    document.getElementById('item-form-cancel').addEventListener('click', () => closeModal('item-modal'));
    document.getElementById('item-form-save').addEventListener('click', saveItemForm);
    document.getElementById('item-delete-btn').addEventListener('click', deleteItem);
    document.getElementById('candidate-form-cancel').addEventListener('click', () => closeModal('candidate-modal'));
    document.getElementById('candidate-form-save').addEventListener('click', saveCandidateForm);
    document.getElementById('candidate-delete-btn').addEventListener('click', deleteCandidate);
    document.getElementById('note-form-cancel').addEventListener('click', () => closeModal('note-modal'));
    document.getElementById('note-form-save').addEventListener('click', saveNoteForm);
    document.getElementById('note-delete-btn').addEventListener('click', deleteNote);
    document.getElementById('memory-form-cancel').addEventListener('click', () => closeModal('memory-modal'));
    document.getElementById('memory-form-save').addEventListener('click', saveMemoryForm);
    document.getElementById('memory-delete-btn').addEventListener('click', deleteMemory);
    document.querySelectorAll('.modal-overlay').forEach(ov => { ov.addEventListener('click', e => { if(e.target === ov) ov.classList.remove('open'); }); });
    document.addEventListener('click', (e) => {
      const popup = document.getElementById('date-picker-popup');
      if(!popup.classList.contains('open')) return;
      if(popup.contains(e.target)) return;
      if(e.target.classList && e.target.classList.contains('date-field')) return;
      closeDatePicker();
    });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDatePicker(); });
  }
  async function init(){
    applyStaticTranslations();
    await loadTrips();
    await renderHome();
    setupListeners();
  }
  // Not auto-started here — trip-note-firebase.html waits for a successful
  // Firebase sign-in before calling this (see the Firebase module script below).
  window.appInit = init;
</script>

<!-- =======================================================================
     FIREBASE BACKEND — replaces Claude.ai's built-in window.storage with
     Firebase Authentication + Cloud Firestore, so this file can be hosted
     anywhere (e.g. GitHub Pages) while still syncing data between exactly
     the people you register in Firebase Authentication.

     Setup steps: see the accompanying "Firebase + GitHub Pages 公開マニュアル".
     You only need to edit the firebaseConfig object below — everything
     else works as-is once your Firebase project is set up.
     ======================================================================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
    setPersistence, browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  // ▼▼▼ Firebaseコンソール → プロジェクトの設定 → 「マイアプリ」で取得した値に置き換えてください ▼▼▼
  const firebaseConfig = {
    apiKey: "AIzaSyCkdaawL5pLnVhOS66zRHNrg93nF622RFw",
    authDomain: "trip-note-ccf03.firebaseapp.com",
    projectId: "trip-note-ccf03",
    storageBucket: "trip-note-ccf03.firebasestorage.app",
    messagingSenderId: "258936823559",
    appId: "1:258936823559:web:ded162e49f36754940efa2"
  };
  // ▲▲▲ ここまで ▲▲▲

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);
  // Keep the sign-in persisted in this browser (IndexedDB) so people don't
  // have to log in again every time they open the page.
  // Persist the session in this browser (IndexedDB) so nobody has to sign in
  // again on every launch. This is async, so sign-in awaits it below.
  const persistenceReady = setPersistence(auth, browserLocalPersistence).catch(() => {});

  // All app data lives in one Firestore collection called "storage", one
  // document per key (e.g. "trips", "trip:abc123", "cover:abc123").
  // Every document is readable/writable only by the emails allowed in your
  // Firestore security rules — that's what makes this a private, 2-person app.
  function docIdFor(key){ return String(key).replace(/\//g, '_'); }

  function installStorageAdapter(){
    window.storage = {
      async get(key){
        const snap = await getDoc(doc(db, 'storage', docIdFor(key)));
        if(!snap.exists()) throw new Error('not-found');
        const data = snap.data();
        return { key, value: data.value, shared: true };
      },
      async set(key, value){
        await setDoc(doc(db, 'storage', docIdFor(key)), { key, value, updatedAt: Date.now() });
        return { key, value, shared: true };
      },
      async delete(key){
        await deleteDoc(doc(db, 'storage', docIdFor(key)));
        return { key, deleted: true, shared: true };
      },
      async list(prefix){
        // Not used by this app, kept only so nothing breaks if it's ever called.
        return { keys: [], prefix: prefix || '', shared: true };
      }
    };
  }

  function setLoginError(msg){ document.getElementById('login-error').textContent = msg; }

  document.getElementById('login-submit').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    setLoginError('');
    if(!email || !password){ setLoginError('メールアドレスとパスワードを入力してください。'); return; }
    try{
      await persistenceReady;
      await signInWithEmailAndPassword(auth, email, password);
    }catch(e){
      console.error('Firebase sign-in error:', e);
      setLoginError('ログインできませんでした（' + (e.code || e.message || 'unknown error') + '）。メールアドレスとパスワードをご確認ください。');
    }
  });
  document.getElementById('login-password').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('login-submit').click();
  });
  document.getElementById('logout-btn').addEventListener('click', () => { signOut(auth); });

  let appStarted = false;
  onAuthStateChanged(auth, (user) => {
    const gate = document.getElementById('login-gate');
    const appEl = document.querySelector('.app');
    const veil = document.getElementById('auth-loading');
    if(veil) veil.classList.add('hidden');   // auth state is known now
    if(user){
      gate.classList.add('hidden');
      if(appEl) appEl.classList.remove('hidden');
      if(!appStarted){
        appStarted = true;
        installStorageAdapter();
        if(window.appInit) window.appInit();
      }
    } else {
      gate.classList.remove('hidden');
      if(appEl) appEl.classList.add('hidden');
    }
  });
  // If Firebase never answers (offline, blocked), don't leave the veil up.
  setTimeout(() => {
    const veil = document.getElementById('auth-loading');
    if(veil && !veil.classList.contains('hidden')){
      veil.classList.add('hidden');
      document.getElementById('login-gate').classList.remove('hidden');
    }
  }, 8000);
</script>
